    <path class="p2" d="M18.825 110.861A71.254 71.254 0 0 1 151.978 63.548" fill="none" stroke="url(#olg)"
          stroke-width="15.045" stroke-linecap="butt" stroke-linejoin="miter" clip-path="url(#olcut2)"/>
    <path class="p3" d="M177.150 39.450L105.150 110.988 73.200 79.038 5.319 146.919" fill="none" stroke="url(#olg)"
          stroke-width="15.045" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="2.5"/>
    <path class="p4" d="M191.850 24.750L162.450 24.750 191.850 54.150Z" fill="url(#olg)" stroke="none"/>
  </g>
  <g class="loop">
    <path class="p1" d="M157.926 79.906A71.254 71.254 0 0 1 24.722 127.690" fill="none" stroke="url(#olg)"
          stroke-width="15.045" stroke-linecap="butt" stroke-linejoin="miter" clip-path="url(#olcut1)"/>
    <path class="p2" d="M18.825 110.861A71.254 71.254 0 0 1 151.978 63.548" fill="none" stroke="url(#olg)"
          stroke-width="15.045" stroke-linecap="butt" stroke-linejoin="miter" clip-path="url(#olcut2)"/>
    <path class="p3" d="M177.150 39.450L105.150 110.988 73.200 79.038 5.319 146.919" fill="none" stroke="url(#olg)"
          stroke-width="15.045" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="2.5"/>
    <path class="p4" d="M191.850 24.750L162.450 24.750 191.850 54.150Z" fill="url(#olg)" stroke="none"/>
  </g>
</svg>
