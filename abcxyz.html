        // Build Pareto series split at A/B limits so color joins sit on the dashed reference lines.
        const buildParetoChartData = (data, aThresh, bThresh) => {
            if (!data || data.length === 0) return [];

            const step = Math.max(1, Math.ceil(data.length / 50));
            const indexSet = new Set([0, data.length - 1]);
            for (let i = 0; i < data.length; i += step) indexSet.add(i);
            for (let i = 1; i < data.length; i++) {
                const prev = data[i - 1].cumPct;
                const curr = data[i].cumPct;
                if ((prev < aThresh && curr > aThresh) || (prev < bThresh && curr > bThresh)
                    || prev === aThresh || curr === aThresh || prev === bThresh || curr === bThresh) {
                    indexSet.add(i - 1);
                    indexSet.add(i);
                }
            }

            const sampled = [...indexSet].sort((a, b) => a - b).map((i) => data[i]);

            // Exact threshold points are shared by both adjacent series so the join sits on the dashed line.
            const seriesFor = (cumPct) => {
                if (cumPct < aThresh) return 'A';
                if (cumPct === aThresh) return 'AB';
                if (cumPct < bThresh) return 'B';
                if (cumPct === bThresh) return 'BC';
                return 'C';
            };

            const makePoint = (itemPct, cumPct, series) => ({
                itemPct,
                cumPct,
                cumA: (series === 'A' || series === 'AB') ? cumPct : null,
                cumB: (series === 'B' || series === 'AB' || series === 'BC') ? cumPct : null,
                cumC: (series === 'C' || series === 'BC') ? cumPct : null,
            });

            const result = [];
            for (let i = 0; i < sampled.length; i++) {
                const curr = sampled[i];
                const prev = i > 0 ? sampled[i - 1] : null;

                if (prev && curr.cumPct > prev.cumPct) {
                    if (prev.cumPct < aThresh && curr.cumPct > aThresh) {
                        const t = (aThresh - prev.cumPct) / (curr.cumPct - prev.cumPct);
                        const itemPct = prev.itemPct + t * (curr.itemPct - prev.itemPct);
                        result.push(makePoint(itemPct, aThresh, 'AB'));
                    }
                    if (prev.cumPct < bThresh && curr.cumPct > bThresh) {
                        const t = (bThresh - prev.cumPct) / (curr.cumPct - prev.cumPct);
                        const itemPct = prev.itemPct + t * (curr.itemPct - prev.itemPct);
                        result.push(makePoint(itemPct, bThresh, 'BC'));
                    }
                }

                result.push(makePoint(curr.itemPct, curr.cumPct, seriesFor(curr.cumPct)));
            }
            return result;
        };

                            <button onClick={onClose} className="px-4 py-2 text-sm text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200">{t('mapping.cancel')}</button>
                            <button
                                onClick={() => onConfirm(skuCol, costCol, dataCols)}
                                disabled={!skuCol || !costCol || dataCols.length === 0}
                                className="px-6 py-2 bg-brand-gold hover:bg-brand-dark text-white text-sm font-bold rounded shadow-md disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                            >
                                {t('mapping.confirm')}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const MainApp = () => {
            const [theme, setTheme] = useOperartisTheme();
            const [isDark, setIsDark] = useState(() => document.documentElement.classList.contains('dark'));
            useEffect(() => {
                const syncDark = () => setIsDark(document.documentElement.classList.contains('dark'));
                syncDark();
                const observer = new MutationObserver(syncDark);
                observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
                return () => observer.disconnect();
            }, [theme]);
            const [file, setFile] = useState(null);
            const [rawJson, setRawJson] = useState([]);
            const [headers, setHeaders] = useState([]);
            const [mappingConfig, setMappingConfig] = useState(null);
            const [isMappingOpen, setIsMappingOpen] = useState(false);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => localStorage.getItem('ax-sidebar-collapsed') === '1');
            const [isLargeScreen, setIsLargeScreen] = useState(() => window.matchMedia('(min-width: 1024px)').matches);
            const showExpandedSidebarContent = !isLargeScreen || !isSidebarCollapsed;

            useEffect(() => {
                const openSettings = () => setIsSettingsOpen(true);
                window.addEventListener('operartis:open-settings', openSettings);
                return () => window.removeEventListener('operartis:open-settings', openSettings);
            }, []);

            useEffect(() => {
                const media = window.matchMedia('(min-width: 1024px)');
                const syncLargeScreen = () => setIsLargeScreen(media.matches);
                syncLargeScreen();
                if (typeof media.addEventListener === 'function') {
                    media.addEventListener('change', syncLargeScreen);
                    return () => media.removeEventListener('change', syncLargeScreen);
                }
                media.addListener(syncLargeScreen);
                return () => media.removeListener(syncLargeScreen);
            }, []);

            useEffect(() => {
                localStorage.setItem('ax-sidebar-collapsed', isSidebarCollapsed ? '1' : '0');
            }, [isSidebarCollapsed]);

            // Configuration State
            const [abcThresholds, setAbcThresholds] = useState({ a: 80, b: 95 }); // A: 0-80, B: 80-95, C: >95
            const [xyzThresholds, setXyzThresholds] = useState({ x: 0.5, y: 1.0 }); // X: <0.5, Y: 0.5-1.0, Z: >1.0

            // Processed Data
            const [analysisData, setAnalysisData] = useState([]);
            const [matrix, setMatrix] = useState({});
            const [summary, setSummary] = useState({});
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [analysisError, setAnalysisError] = useState('');
            const analysisRequestRef = useRef(0);

            // UI State
            const [activeTab, setActiveTab] = useState('dashboard'); // dashboard, list
            const [searchTerm, setSearchTerm] = useState('');
            const [searchActive, setSearchActive] = useState(false);
            const searchInputRef = useRef(null);
            const [filterClass, setFilterClass] = useState(null);
            const fileInputRef = useRef(null);

            const paretoChartData = useMemo(
                () => buildParetoChartData(analysisData, abcThresholds.a, abcThresholds.b),
                [analysisData, abcThresholds.a, abcThresholds.b]
            );
            const interfaceReady = analysisData.length > 0;

            // I18n State
            const [lang, setLang] = useState(() => window.getOperartisLang());

            useEffect(() => {
                const handler = (event) => {
                    const nextLang = (event.detail && event.detail.lang) || window.getOperartisLang();
                    setLang(prev => prev === nextLang ? prev : nextLang);
                };
                window.addEventListener('operartis:lang-change', handler);
                return () => window.removeEventListener('operartis:lang-change', handler);
            }, []);

            const t = (key) => {
                const keys = key.split('.');
                let val = TRANSLATIONS[lang] || TRANSLATIONS.en;
                for (const k of keys) {
                    val = val ? val[k] : null;
                }
                if (val != null) return val;
                let fallback = TRANSLATIONS.en;
                for (const k of keys) {
                    fallback = fallback ? fallback[k] : null;
                }
                return fallback || key;
            };

            const environmentBadge = getEnvironmentBadgeConfig(getDeploymentEnvironment());

            useEffect(() => {
                window.persistOperartisLang(lang);
            }, [lang]);

            // File Handler — clear input after each pick so the same file can be chosen again
            const openFilePicker = () => {
                if (!fileInputRef.current) return;
                fileInputRef.current.value = '';
                fileInputRef.current.click();
            };

            const handleFileUpload = (e) => {
                const f = e.target.files[0];
                e.target.value = '';
                if (!f) return;
                try {
                    window.OperartisSecurity.validateUploadFile(f, { allowedExtensions: ['.xlsx', '.xls', '.csv'] });
                } catch (err) {
                    alert(err.message);
                    return;
                }
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary', cellDates: true });
                        window.OperartisSecurity.validateWorkbook(wb);
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];

                        // Pass 1: Get Headers with formatting (preserves dates like "Jan 25")
                        const formattedData = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false });

                        // Pass 2: Get Data with raw values (for numbers/math)
                        const rawData = XLSX.utils.sheet_to_json(ws, { header: 1 });

                        if (rawData.length > 1) {
                            setHeaders(formattedData[0]); // UI gets nice headers
                            setRawJson(rawData.slice(1)); // Logic gets raw numbers
                            setFile(f);
                            setMappingConfig(null);
                            setAnalysisData([]);
                            setMatrix({});
                            setSummary({});
                            setAnalysisError('');
                            setIsMappingOpen(true);
                        }
                    } catch (err) {
                        alert(err.message || 'Failed to read file.');
                    }
                };
                reader.readAsBinaryString(f);
            };

            const readBackendError = async (response) => {
                const data = await response.json().catch(() => ({}));
                if (typeof data.detail === 'string') return data.detail;
                if (Array.isArray(data.detail)) {
                    return data.detail.map(item => item.msg || item.message || item.detail).filter(Boolean).join(' ');
                }
                return data.message || 'ABC-XYZ analysis failed.';
            };

            const requestBackendAnalysis = useCallback(async (mapping, options = {}) => {
                if (!mapping || rawJson.length === 0) return;
                const requestId = ++analysisRequestRef.current;
                setIsAnalyzing(true);
                setAnalysisError('');

                try {
                    const response = await window.OperartisApi.apiFetch('/abcxyz/analyze', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            headers,
                            rows: rawJson,
                            sku_col: mapping.skuCol,
                            cost_col: mapping.costCol,
                            data_cols: mapping.dataCols,
                            abc_thresholds: abcThresholds,
                            xyz_thresholds: xyzThresholds,
                            input_filename: file?.name || null,
                            record_job: options.recordJob === true
                        })
                    });

                    if (!response.ok) {
                        throw new Error(await readBackendError(response));
                    }

                    const result = await response.json();
                    if (requestId !== analysisRequestRef.current) return;
                    setAnalysisData(result.analysis_data || []);
                    setMatrix(result.matrix || {});
                    setSummary(result.summary || {});
                } catch (err) {
                    if (requestId !== analysisRequestRef.current) return;
                    const message = err.message || 'ABC-XYZ analysis failed.';
                    setAnalysisData([]);
                    setMatrix({});
                    setSummary({});
                    setAnalysisError(message);
                    alert(message);
                } finally {
                    if (requestId === analysisRequestRef.current) {
                        setIsAnalyzing(false);
                    }
                }
            }, [headers, rawJson, file, abcThresholds, xyzThresholds]);

            const confirmMapping = (skuCol, costCol, dataCols) => {
                setMappingConfig({ skuCol, costCol, dataCols });
                setIsMappingOpen(false);
            };

            const handleRunEngine = () => {
                if (!mappingConfig || rawJson.length === 0 || isAnalyzing) return;
                setActiveTab('dashboard');
                requestBackendAnalysis(mappingConfig, { recordJob: true });
            };

            const handleReset = () => {
                setFile(null);
                setRawJson([]);
                setHeaders([]);
                setMappingConfig(null);
                setIsMappingOpen(false);
                setAbcThresholds({ a: 80, b: 95 });
                setXyzThresholds({ x: 0.5, y: 1.0 });
                setAnalysisData([]);
                setMatrix({});
                setSummary({});
                setAnalysisError('');
                setIsAnalyzing(false);
                setActiveTab('dashboard');
                setSearchTerm('');
                if (fileInputRef.current) fileInputRef.current.value = "";
                setIsSidebarOpen(false);
            };

            const handleExport = async () => {
                if (analysisData.length === 0) return;
                if (typeof ExcelJS === 'undefined') {
                    console.error('ExcelJS not loaded');
                    alert('Export library not loaded. Please refresh the page.');
                    return;
                }

                const workbook = new ExcelJS.Workbook();
                const worksheet = workbook.addWorksheet("Analysis Report");

                // --- 1. LOGO & BRANDING ---
                try {
                    const response = await fetch("./icononly_transparent_nobuffer.png");
                    const blob = await response.blob();
                    const buffer = await blob.arrayBuffer();
                    const logoId = workbook.addImage({ buffer, extension: "png" });

                    worksheet.addImage(logoId, {
                        tl: { col: 1.2, row: 0 },
                        ext: { width: 60, height: 60 }
                    });
                } catch (e) {
                    console.error("Logo fetch failed. Ensure you are running on a local server (http://) not file:// protocol.", e);
                    alert("Logo could not be loaded. Please ensure you are running this page via a web server (http://localhost), not directly as a file.");
                }

                // Title Area
                worksheet.mergeCells("C1:I2");
                const titleCell = worksheet.getCell("C1");
                titleCell.value = "OPERARTIS ANALYTICS REPORT";
                titleCell.font = { name: "Arial", size: 24, bold: true, color: { argb: "FFE38800" } };
                titleCell.alignment = { vertical: "middle", horizontal: "left" };

                worksheet.mergeCells("C3:I3");
                const subTitleCell = worksheet.getCell("C3");
                subTitleCell.value = "Optimizing Today, Growing Tomorrow.";
                subTitleCell.font = { name: "Arial", size: 12, italic: true, color: { argb: "FFE38800" } };

                // --- 2. METADATA BOX ---
                // Start Row 5
                const metaLabels = ["Report By:", "Report For:", "Version:"];
                const metaValues = ["Operartis Analytics", "ABC-XYZ Analysis", "1.0"];
                const metaLabels2 = ["Report Date:", "Total SKUs:", "Total Value:"];
                const metaValues2 = [new Date().toLocaleString(), summary.totalSkus, fmtCurrency(summary.totalValue)];

                for (let i = 0; i < 3; i++) {
                    const r = 5 + i;
                    // Left Column
                    worksheet.getCell(`B${r}`).value = metaLabels[i];
                    worksheet.getCell(`B${r}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEFEFEF' } };
                    worksheet.getCell(`B${r}`).font = { bold: true };
                    worksheet.getCell(`B${r}`).border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };

                    worksheet.getCell(`C${r}`).value = metaValues[i];
                    worksheet.getCell(`C${r}`).border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };

                    // Right Column
                    worksheet.getCell(`E${r}`).value = metaLabels2[i];
                    worksheet.getCell(`E${r}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEFEFEF' } };
                    worksheet.getCell(`E${r}`).font = { bold: true };
                    worksheet.getCell(`E${r}`).border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };

                    worksheet.getCell(`F${r}`).value = metaValues2[i];
                    worksheet.getCell(`F${r}`).border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
                }

                // --- 3. MATRIX SUMMARY ---
                const matrixStartRow = 10;
                const mHeader = worksheet.getCell(`B${matrixStartRow}`);
                mHeader.value = "MATRIX SUMMARY";
                mHeader.font = { bold: true, size: 12, color: { argb: 'FFFFFFFF' } };
                // Using merge for header appearance if desired, currently single cell title

                const mHeadRow = worksheet.getRow(matrixStartRow + 1);
                mHeadRow.values = ["", "", "X (Low Var)", "Y (Med Var)", "Z (High Var)"];

                const matrixData = [
                    ["", "A (High Val)", matrix['AX']?.count || 0, matrix['AY']?.count || 0, matrix['AZ']?.count || 0],
                    ["", "B (Med Val)", matrix['BX']?.count || 0, matrix['BY']?.count || 0, matrix['BZ']?.count || 0],
                    ["", "C (Low Val)", matrix['CX']?.count || 0, matrix['CY']?.count || 0, matrix['CZ']?.count || 0]
                ];

                matrixData.forEach((row, idx) => {
                    const r = worksheet.getRow(matrixStartRow + 2 + idx);
                    r.values = row;
                });

                // Style Matrix Header Area
                for (let c = 3; c <= 5; c++) {
                    const cell = worksheet.getRow(matrixStartRow + 1).getCell(c);
                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF101F3A' } };
                    cell.font = { color: { argb: 'FFFFFFFF' }, bold: true };
                    cell.alignment = { horizontal: 'center' };
                }

                // --- 4. DETAILED TABLE ---
                const tableStartRow = 17;
                const tableHeader = ["", "Class", "SKU", "Total Value", "Total Qty", "Avg Demand", "CV", "ABC", "XYZ"];
                const headerRow = worksheet.getRow(tableStartRow);
                headerRow.values = tableHeader;

                headerRow.eachCell((cell, colNumber) => {
                    if (colNumber > 1) { // Skip empty A col
                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF101F3A' } };
                        cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
                        cell.alignment = { horizontal: 'center' };
                    }
                });

                // Add Data
                analysisData.forEach((item, index) => {
                    const row = worksheet.getRow(tableStartRow + 1 + index);
                    row.values = [
                        "",
                        window.OperartisSecurity.escapeSpreadsheetFormula(item.class),
                        window.OperartisSecurity.escapeSpreadsheetFormula(item.sku),
                        item.totalValue,
                        item.totalQty,
                        item.avgDemand,
                        item.cv,
                        window.OperartisSecurity.escapeSpreadsheetFormula(item.abc),
                        window.OperartisSecurity.escapeSpreadsheetFormula(item.xyz)
                    ];

                    // Formatting
                    row.getCell(4).numFmt = '"$"#,##0'; // Value
                    row.getCell(5).numFmt = '#,##0.0';  // Qty
                    row.getCell(6).numFmt = '#,##0.0';  // Avg
                    row.getCell(7).numFmt = '0.00';     // CV

                    // Conditional Color for Class (Col 2)
                    let argb = 'FFFFFFFF';
                    const c = item.class;
                    if (c.startsWith('A')) argb = c.endsWith('X') ? 'FFD1FAE5' : c.endsWith('Y') ? 'FFFEF3C7' : 'FFFFE4E6';
                    else if (c.startsWith('B')) argb = c.endsWith('X') ? 'FFDBEAFE' : c.endsWith('Y') ? 'FFFEF3C7' : 'FFFFE4E6';
                    else if (c.startsWith('C')) argb = 'FFF1F5F9';

                    const classCell = row.getCell(2);
                    classCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb } };
                    classCell.font = { bold: true };
                    classCell.alignment = { horizontal: 'center' };
                    classCell.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };

                    // General Borders
                    for (let i = 3; i <= 9; i++) {
                        row.getCell(i).border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
                    }
                });

                // --- COPYRIGHT FOOTER ---
                const footerRowIdx = tableStartRow + 1 + analysisData.length + 1;
                const footerRow = worksheet.getRow(footerRowIdx);
                footerRow.getCell(2).value = "© 2025 Operartis Analytics. All rights reserved.";
                footerRow.getCell(2).font = { italic: true, color: { argb: 'FF888888' }, size: 9 };
                worksheet.mergeCells(`B${footerRowIdx}:D${footerRowIdx}`);

                // Column Widths
                worksheet.columns = [
                    { width: 5 }, // A margin
                    { width: 12 }, // Class
                    { width: 25 }, // SKU
                    { width: 18 }, // Value
                    { width: 15 }, // Qty
                    { width: 15 }, // Avg
                    { width: 10 }, // CV
                    { width: 8 },  // A
                    { width: 8 }   // X
                ];

                // --- 5. EXPORT ---
                const bufferOut = await workbook.xlsx.writeBuffer();
                const blobOut = new Blob([bufferOut], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
                window.OperartisSecurity.downloadBlob(blobOut, `Operartis_ABC_Report_${new Date().toISOString().split('T')[0]}.xlsx`);
            };

            // Recalculate through the backend when thresholds change after a successful run.
            useEffect(() => {
                if (!mappingConfig || rawJson.length === 0 || analysisData.length === 0) return;
                const timeoutId = window.setTimeout(() => {
                    requestBackendAnalysis(mappingConfig, { recordJob: false });
                }, 250);
                return () => window.clearTimeout(timeoutId);
            }, [abcThresholds, xyzThresholds]);



            return (
                <div className="flex h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300">

                    {/* SIDEBAR */}
                    <div className={`fc-sidebar-shell fixed lg:relative inset-y-0 left-0 z-50 w-64 ${isSidebarCollapsed ? 'lg:w-[76px]' : 'lg:w-64'} transform transition-all duration-300 ease-in-out ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>
                        <input type="file" ref={fileInputRef} onChange={handleFileUpload} className="hidden" accept=".xlsx,.xls,.csv" />
                        <button
                            type="button"
                            onClick={() => setIsSidebarCollapsed(prev => !prev)}
                            className="fc-sidebar-toggle hidden lg:flex items-center justify-center h-6 w-6 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 hover:text-brand-gold hover:border-brand-gold shadow-md transition-colors"
                            title={isSidebarCollapsed ? t('sidebar.expand_sidebar') : t('sidebar.collapse_sidebar')}
                        >
                            {isSidebarCollapsed ? <ChevronRightIcon /> : <ChevronLeftIcon />}
                        </button>
                        <aside data-collapsed={isSidebarCollapsed ? 'true' : 'false'} className="fc-sidebar flex w-full h-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-r border-white/20 dark:border-white/10 flex-col shadow-2xl lg:shadow-none">
                            <div className="h-16 flex items-center justify-center px-4 border-b border-white/20 dark:border-white/10 shrink-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md gap-2 relative sticky top-0 z-20">
                                <a href="./">
                                    <img src="./icononly_transparent_nobuffer.png" className="h-8 w-8 md:h-10 md:w-10 object-contain cursor-pointer transition-transform hover:scale-110" onError={(e) => e.target.style.display = 'none'} />
                                </a>
                                <h1 className={`font-bold text-slate-800 dark:text-slate-100 tracking-tight text-base ${isSidebarCollapsed ? 'lg:hidden' : ''}`}>OPERARTIS</h1>
                                <button onClick={() => setIsSidebarOpen(false)} className="lg:hidden absolute right-4 text-slate-400"><XIcon /></button>
                            </div>

                            {isLargeScreen && isSidebarCollapsed && (
                                <div className="relative z-10 flex flex-1 flex-col items-center gap-3 pt-5 pb-4 min-h-0 pointer-events-auto">
                                    <button
                                        type="button"
                                        onClick={openFilePicker}
                                        className={`relative flex items-center justify-center h-11 w-11 rounded-xl border transition-all ${file ? (mappingConfig ? 'border-emerald-500/40 bg-emerald-500/10 text-emerald-500' : 'border-brand-gold/40 bg-amber-500/10 text-brand-gold') : 'border-slate-200 dark:border-slate-700 text-slate-400 hover:text-brand-gold hover:border-brand-gold'}`}
                                        title={file ? file.name : t('sidebar.upload_placeholder')}
                                    >
                                        <UploadIcon width="18" height="18" />
                                        {file && <span className={`absolute -top-0.5 -right-0.5 h-2.5 w-2.5 rounded-full border-2 border-white dark:border-slate-900 ${mappingConfig ? 'bg-emerald-500' : 'bg-brand-gold'}`}></span>}
                                    </button>
                                    {file && (
                                        <button
                                            type="button"
                                            onClick={() => setIsMappingOpen(true)}
                                            className="flex items-center justify-center h-11 w-11 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-400 hover:text-brand-gold hover:border-brand-gold transition-all"
                                            title={t('sidebar.edit_mapping')}
                                        >
                                            <ColumnsIcon width="18" height="18" />
                                        </button>
                                    )}
                                    <div className="h-px w-8 bg-slate-200 dark:bg-slate-700 my-1"></div>
                                    <button
                                        type="button"
                                        onClick={() => interfaceReady && setActiveTab('dashboard')}
                                        disabled={!interfaceReady}
                                        className={`flex items-center justify-center h-11 w-11 rounded-xl border transition-all ${!interfaceReady ? 'border-transparent bg-slate-100 dark:bg-slate-800 text-slate-400 cursor-not-allowed' : activeTab === 'dashboard' ? 'border-brand-gold/40 bg-brand-gold/10 text-brand-gold' : 'border-slate-200 dark:border-slate-700 text-slate-400 hover:text-brand-gold hover:border-brand-gold'}`}
                                        title={t('tabs.dashboard')}
                                    >
                                        <GridIcon />
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => interfaceReady && setActiveTab('list')}
                                        disabled={!interfaceReady}
                                        className={`flex items-center justify-center h-11 w-11 rounded-xl border transition-all ${!interfaceReady ? 'border-transparent bg-slate-100 dark:bg-slate-800 text-slate-400 cursor-not-allowed' : activeTab === 'list' ? 'border-brand-gold/40 bg-brand-gold/10 text-brand-gold' : 'border-slate-200 dark:border-slate-700 text-slate-400 hover:text-brand-gold hover:border-brand-gold'}`}
                                        title={t('tabs.list')}
                                    >
                                        <EyeIcon />
                                    </button>
                                    <div className="h-px w-8 bg-slate-200 dark:bg-slate-700 my-1"></div>
                                    <button
                                        type="button"
                                        onClick={handleRunEngine}
                                        disabled={!mappingConfig || rawJson.length === 0 || isAnalyzing}
                                        className={`flex items-center justify-center h-11 w-11 rounded-xl shadow-sm transition-all ${!mappingConfig || rawJson.length === 0 || isAnalyzing ? 'bg-slate-100 dark:bg-slate-800 text-slate-400 cursor-not-allowed' : 'bg-brand-gold text-white hover:bg-brand-dark'}`}
                                        title={isAnalyzing ? t('sidebar.run_engine_processing') : t('sidebar.run_engine_btn')}
                                    >
                                        {isAnalyzing ? <span className="animate-spin inline-flex"><RefreshIcon /></span> : <PlayIcon />}
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleExport}
                                        disabled={analysisData.length === 0}
                                        className={`flex items-center justify-center h-11 w-11 rounded-xl shadow-sm transition-all ${analysisData.length === 0 ? 'bg-slate-100 dark:bg-slate-800 text-slate-400 cursor-not-allowed' : 'bg-emerald-500 text-white hover:bg-emerald-600'}`}
                                        title={t('sidebar.export_btn')}
                                    >
                                        <DownloadIcon width="18" height="18" />
                                    </button>
                                    <button
                                        type="button"

                                                                    if (!viewBox) return null;
                                                                    const cx = (viewBox.x ?? 0) + 12;
                                                                    const cy = (viewBox.y ?? 0) + (viewBox.height ?? 0) / 2;
                                                                    return (
                                                                        <text
                                                                            x={cx}
                                                                            y={cy}
                                                                            transform={`rotate(-90, ${cx}, ${cy})`}
                                                                            textAnchor="middle"
                                                                            dominantBaseline="middle"
                                                                            fontSize={10}
                                                                            fill="#64748b"
                                                                        >
                                                                            {t('dashboard.pareto_ylabel')}
                                                                        </text>
                                                                    );
                                                                }}
                                                            />
                                                            <Tooltip content={<CustomParetoTooltip />} cursor={{ stroke: '#64748b', strokeWidth: 1 }} />
                                                            <ReferenceLine y={abcThresholds.a} stroke="#10b981" strokeDasharray="3 3" label={{ value: 'A Limit', fill: '#10b981', fontSize: 10, position: 'insideTopLeft' }} />
                                                            <ReferenceLine y={abcThresholds.b} stroke="#3b82f6" strokeDasharray="3 3" label={{ value: 'B Limit', fill: '#3b82f6', fontSize: 10, position: 'insideTopLeft' }} />
                                                            <Line type="linear" dataKey="cumA" stroke="#10b981" strokeWidth={3} dot={false} connectNulls={false} isAnimationActive={false} />
                                                            <Line type="linear" dataKey="cumB" stroke="#3b82f6" strokeWidth={3} dot={false} connectNulls={false} isAnimationActive={false} />
                                                            <Line type="linear" dataKey="cumC" stroke="#64748b" strokeWidth={3} dot={false} connectNulls={false} isAnimationActive={false} />
                                                        </LineChart>
                                                    </ResponsiveContainer>
                                                </div>
                                                <div className="mt-4 text-xs text-slate-500 text-center">
                                                    {t('dashboard.pareto_caption')}
                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                )}

                                {/* List View */}
                                {activeTab === 'list' && (
                                    <div className="flex-1 flex flex-col overflow-hidden">

                                        <div className="flex-1 overflow-auto scroller">
                                            <table className="w-full text-left text-sm min-w-0 sm:min-w-[600px]">
                                                <thead className="bg-slate-100 dark:bg-slate-900 sticky top-0 z-10 text-xs font-bold uppercase text-slate-500">
                                                    <tr>
                                                        <th className="px-6 py-3">{t('list.col_class')}</th>
                                                        <th className="px-6 py-3">{t('list.col_sku')}</th>
                                                        <th className="px-6 py-3 text-right">{t('list.col_val')}</th>
                                                        <th className="hidden sm:table-cell px-6 py-3 text-right">{t('list.col_cv')}</th>
                                                        <th className="px-6 py-3 text-right">{t('list.col_avg')}</th>
                                                        <th className="px-6 py-3">{t('list.col_pattern')}</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 dark:divide-slate-800 bg-white dark:bg-slate-950">
                                                    {analysisData
                                                        .filter(item => {
                                                            const matchSearch = item.sku.toString().toLowerCase().includes(searchTerm.toLowerCase());
                                                            const matchFilter = filterClass ? item.class === filterClass : true;
                                                            return matchSearch && matchFilter;
                                                        })
                                                        .slice(0, 100) // Render limit for performance
                                                        .map((item, idx) => (
                                                            <tr key={idx} className="hover:bg-slate-50 dark:hover:bg-slate-900 transition-colors">
                                                                <td className="px-6 py-3">
                                                                    <span className={`inline-block px-2 py-0.5 rounded text-[10px] font-bold border ${item.abc === 'A' ? 'bg-emerald-50 text-emerald-600 border-emerald-200' :
                                                                        item.abc === 'B' ? 'bg-blue-50 text-blue-600 border-blue-200' :
                                                                            'bg-slate-50 text-slate-500 border-slate-200'
                                                                        }`}>
                                                                        {item.class}
                                                                    </span>
                                                                </td>
                                                                <td className="px-6 py-3 font-mono text-slate-700 dark:text-slate-300 font-bold">{item.sku}</td>
                                                                <td className="px-6 py-3 text-right font-mono">{fmtNum(item.totalValue, 0)}</td>
                                                                <td className="hidden sm:table-cell px-6 py-3 text-right font-mono text-slate-500">{item.cv.toFixed(2)}</td>
                                                                <td className="px-6 py-3 text-right font-mono text-slate-500">{fmtNum(item.avgDemand, 1)}</td>
                                                                <td className="px-6 py-3 w-32 h-12">
                                                                    {/* Micro Chart */}
                                                                    <ResponsiveContainer width="100%" height="100%">
                                                                        <LineChart data={item.demandHistory.map((d, i) => ({ v: d }))}>
                                                                            <Line type="monotone" dataKey="v" stroke={item.xyz === 'X' ? '#10b981' : item.xyz === 'Y' ? '#f59e0b' : '#ef4444'} strokeWidth={1.5} dot={false} />
                                                                        </LineChart>
                                                                    </ResponsiveContainer>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                </tbody>
                                            </table>
                                            {analysisData.length > 100 && (
                                                <div className="p-4 text-center text-xs text-slate-400 italic">
                                                    {t('list.showing_msg')} 100 {t('list.items_msg')} {analysisData.length}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </>
                        )}

                        {/* Mapping Modal */}
                        <MappingModal
                            headers={headers}
                            isOpen={isMappingOpen}
                            onClose={() => {
                                setIsMappingOpen(false);
                                // Discard only when mapping was never confirmed (first upload / re-upload cancel)
                                if (!mappingConfig) {
                                    setFile(null);
                                    setRawJson([]);
                                    setHeaders([]);
                                    if (fileInputRef.current) fileInputRef.current.value = '';
                                }
                            }}
                            onConfirm={confirmMapping}
                            t={t}
                        />

                        {/* Settings Modal */}
                        <SettingsModal
                            isOpen={isSettingsOpen}
                            onClose={() => setIsSettingsOpen(false)}
                            theme={theme}
                            setTheme={setTheme}
                            lang={lang}
                            setLang={setLang}
                            t={t}
                        />

                    </main>
                </div>
            );
        };

        ReactDOM.render(<MainApp />, document.getElementById('root'));
    </script>
</body>

</html>
