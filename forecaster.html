            const [activeTab, setActiveTab] = useState("overview"); // overview | sku id
            const [overviewSearchQuery, setOverviewSearchQuery] = useState("");
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isMappingModalOpen, setIsMappingModalOpen] = useState(false);
            const [theme, setTheme] = useOperartisTheme();
            const [isDark, setIsDark] = useState(() => document.documentElement.classList.contains('dark'));

            useEffect(() => {
                const syncDark = () => setIsDark(document.documentElement.classList.contains('dark'));
                window.addEventListener('operartis:theme-change', syncDark);
                return () => window.removeEventListener('operartis:theme-change', syncDark);
            }, []);

            useEffect(() => {
                const openSettings = () => setIsSettingsOpen(true);
                window.addEventListener('operartis:open-settings', openSettings);
                return () => window.removeEventListener('operartis:open-settings', openSettings);
            }, []);

            useEffect(() => {
                const media = window.matchMedia('(min-width: 1024px)');
                const syncLargeScreen = () => setIsLargeScreen(media.matches);
                syncLargeScreen();
                if (typeof media.addEventListener === 'function') {
                    media.addEventListener('change', syncLargeScreen);
                    return () => media.removeEventListener('change', syncLargeScreen);
                }
                media.addListener(syncLargeScreen);
                return () => media.removeListener(syncLargeScreen);
            }, []);

            // API State
            const [apiUrl, setApiUrl] = useState(API_ENDPOINTS.PROD);
            const [connectionStatus, setConnectionStatus] = useState('checking');
            const deploymentEnvironment = getDeploymentEnvironment();
            const environmentBadge = getEnvironmentBadgeConfig(deploymentEnvironment);
            const BASE_URL = apiUrl;

            // Force re-render on resize/rotate to fix chart scaling
            const [layoutKey, setLayoutKey] = useState(0);
            useEffect(() => {
                let timeoutId;
                const handleResize = () => {
                    clearTimeout(timeoutId);
                    timeoutId = setTimeout(() => setLayoutKey(prev => prev + 1), 200);
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            // Persist sidebar collapse state + nudge chart layout to re-measure after the width transition
            useEffect(() => {
                localStorage.setItem('fc-sidebar-collapsed', isSidebarCollapsed ? '1' : '0');
                const id = setTimeout(() => setLayoutKey(prev => prev + 1), 320);
                return () => clearTimeout(id);
            }, [isSidebarCollapsed]);

            const fileInputRef = useRef(null);

            // --- EFFECTS ---
            useEffect(() => {
                const checkConnection = async () => {
                    const isLocal = deploymentEnvironment === 'local';
                    if (!isLocal) { setApiUrl(API_ENDPOINTS.PROD); setConnectionStatus('cloud'); return; }
                    try {
                        const controller = new AbortController();
                        setTimeout(() => controller.abort(), 2000);
                        const res = await fetch(`${API_ENDPOINTS.LOCAL}/`, { method: 'GET', signal: controller.signal });
                        if (res.ok || res.status === 404) { setApiUrl(API_ENDPOINTS.LOCAL); setConnectionStatus('local'); }
                        else throw new Error('Err');
                    } catch (e) { setApiUrl(API_ENDPOINTS.PROD); setConnectionStatus('cloud'); }
                };
                checkConnection();
            }, [deploymentEnvironment]);

            // Toggle mobile scroll behavior based on results presence - DISABLE for fixed view
            // useEffect(() => {
            //     if (batchResults && batchResults.length > 0) {
            //         document.body.classList.add('mobile-result-scroll');
            //     } else {
            //         document.body.classList.remove('mobile-result-scroll');
            //     }
            // }, [batchResults]);

            // Language State
            const [lang, setLang] = useState(() => window.getOperartisLang());
            useEffect(() => {
                const handler = (event) => {
                    const nextLang = (event.detail && event.detail.lang) || window.getOperartisLang();
                    setLang(prev => prev === nextLang ? prev : nextLang);
                };
                window.addEventListener('operartis:lang-change', handler);
                return () => window.removeEventListener('operartis:lang-change', handler);
            }, []);
            useEffect(() => { window.persistOperartisLang(lang); }, [lang]);

            const t = (key) => {
                const keys = key.split('.');
                let val = TRANSLATIONS[lang] || TRANSLATIONS.en;
                for (const k of keys) {
                    val = val ? val[k] : null;
                }
                if (val != null) return val;
                let fallback = TRANSLATIONS.en;
                for (const k of keys) {
                    fallback = fallback ? fallback[k] : null;
                }
                return fallback || key;
            };

            // --- POLLING (merge partial results as each SKU completes) ---
            useEffect(() => {
                let cancelled = false;
                let interval;
                if (isPolling && jobId) {
                    const polledJobId = jobId;
                    const generation = runGenerationRef.current;
                    const pollOnce = async () => {
                        try {
                            const res = await fetch(`${BASE_URL}/batch_status/${polledJobId}`);
                            const data = await res.json();
                            if (cancelled || generation !== runGenerationRef.current) return;

                            setJobStatus(data.status);

                            const incoming = data.result?.results || [];
                            if (incoming.length > 0) {
                                setBatchResults((prev) => {
                                    const map = new Map((prev || []).map((r) => [String(r.sku), r]));
                                    for (const r of incoming) map.set(String(r.sku), r);
                                    return Array.from(map.values());
                                });
                                const done = new Set(incoming.map((r) => String(r.sku)));
                                setRunningSkus((prev) => prev.filter((sku) => !done.has(String(sku))));
                            }

                            const totalCount = data.total_count != null ? Number(data.total_count) : 0;
                            const completedCount = data.completed_count != null
                                ? Number(data.completed_count)
                                : incoming.length;
                            const allSkusFinished = totalCount > 0 && completedCount >= totalCount;
                            const jobFinished = data.status === 'completed' || data.status === 'failed' || allSkusFinished;

                            if (jobFinished) {
                                setIsPolling(false);
                                setRunningSkus([]);
                                if (data.status === 'failed') {
                                    setError("Job Failed: " + data.error);
                                } else {
                                    window.OperartisApi?.broadcastDashboardDataChanged?.('forecaster-completed');
                                }
                            }
                        } catch (e) {
                            if (!cancelled && generation === runGenerationRef.current) console.error(e);
                        }
                    };
                    pollOnce();
                    interval = setInterval(pollOnce, 1000);
                }
                return () => {
                    cancelled = true;
                    clearInterval(interval);
                };
            }, [isPolling, jobId, BASE_URL]);

            // --- HANDLERS ---
            const handleFileChange = (e) => {
                const f = e.target.files[0];
                if (!f) return;
                try {
                    window.OperartisSecurity.validateUploadFile(f, { allowedExtensions: ['.xlsx', '.xls'] });
                } catch (err) {
                    setError(err.message);
                    e.target.value = null;
                    return;
                }
                setFile(f);
                setError(null);
                setAvailableCols([]);
                setSheetRows([]);
                setMappedSkus([]);
                setItemTabs([]);
                setSelectedSkus([]);
                setRunningSkus([]);
                setSkuValidationMethods({});
                setBatchResults(null);
                setSkuCol("");
                setStartCol("");
                setEndCol("");
                setSkuColIdx(-1);
                setStartColIdx(-1);
                setEndColIdx(-1);
                setActiveTab("overview");
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const wb = XLSX.read(evt.target.result, { type: 'binary', cellDates: true });
                        window.OperartisSecurity.validateWorkbook(wb);
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const rawRows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
                        const rawHeaders = rawRows[0] || [];

                        // Convert headers - handle Date objects and other types
                        const normalizeCell = (h) => {
                            if (h instanceof Date) {
                                // Format Date as YYYY-MM-DD
                                return h.toISOString().split('T')[0];
                            } else if (typeof h === 'number') {
                                // Could be Excel serial date number - try to convert
                                // Excel serial date: days since 1900-01-01
                                const excelEpoch = new Date(1899, 11, 30);
                                const possibleDate = new Date(excelEpoch.getTime() + h * 24 * 60 * 60 * 1000);
                                // Check if it's a reasonable date (between 1990 and 2100)
                                if (possibleDate.getFullYear() >= 1990 && possibleDate.getFullYear() <= 2100) {
                                    return possibleDate.toISOString().split('T')[0];
                                }
                                return String(h);
                            }
                            return String(h);
                        };
                        const headers = rawHeaders.map(normalizeCell);

                        if (headers && headers.length > 0) {
                            setAvailableCols(headers);
                            setSheetRows(rawRows.slice(1));
                            setIsMappingModalOpen(true);
                        } else {
                            setError("No headers found in file.");
                        }
                    } catch (err) {
                        console.error('File parse error:', err);
                        setError("Failed to parse file headers");
                    }
                };
                reader.readAsBinaryString(f);
            };

            const handleMappingConfirm = (sku, start, end) => {
                setSkuCol(sku);
                setStartCol(start);
                setEndCol(end);
                setIsMappingModalOpen(false);

                // Calculate and store column indices immediately
                const skuIdx = availableCols.indexOf(sku);
                const startIdx = availableCols.indexOf(start);
                const endIdx = availableCols.indexOf(end);

                setSkuColIdx(skuIdx);
                setStartColIdx(startIdx);
                setEndColIdx(endIdx);

                console.log('Mapping confirmed - Indices:', { skuIdx, startIdx, endIdx });

                // Build Main Table SKU list from mapped data (pre-forecast)
                const seen = new Set();
                const skus = [];
                if (skuIdx >= 0) {
                    for (const row of sheetRows) {
                        if (!row || row[skuIdx] == null || row[skuIdx] === '') continue;
                        const value = String(row[skuIdx]).trim();
                        if (!value || seen.has(value)) continue;
                        seen.add(value);
                        skus.push(value);
                    }
                }
                setMappedSkus(skus);
                setItemTabs([]);
                setSelectedSkus(skus);
                setRunningSkus([]);
                setSkuValidationMethods({});
                setOverviewSearchQuery("");
                setActiveTab("overview");
                setCurrentSku(null);
                setBatchResults(null);

                // Calculate total time series from column range
                const total = endIdx - startIdx + 1;
                setTotalTimeSeries(total);

                // Set initial values: Test = 6, Train = Total - 6, Forecast = Test
                const initialTest = Math.min(6, Math.floor(total / 2));
                const initialTrain = total - initialTest;
                setTestHorizon(initialTest.toString());
                setTrainHorizon(initialTrain.toString());
                setForecastSteps(initialTest.toString());
            };

            const startBatchForSkus = async (skusToRun) => {
                if (!skusToRun.length) return;

                const rerunSet = new Set(skusToRun.map(String));
                // Bump generation so any in-flight poll from a prior job is ignored.
                const generation = ++runGenerationRef.current;

                // Show Processing on the Run button immediately; clear jobId so we do not
                // keep polling the previous job while /batch_init is in flight.
                setIsPolling(true);
                setJobId(null);

                // Drop previous metrics/charts for SKUs being re-run so only the newest run is shown.
                setBatchResults((prev) => {
                    if (!prev?.length) return null;
                    const next = prev.filter((r) => !rerunSet.has(String(r.sku)));
                    return next.length ? next : null;
                });
                setItemTabs((prev) => prev.filter((sku) => !rerunSet.has(String(sku))));
                setCurrentSku((prev) => (prev && rerunSet.has(String(prev)) ? null : prev));
                setActiveTab("overview");

                setError(null);
                setJobStatus("queued");
                setRunningSkus(skusToRun);
                setSkuValidationMethods((prev) => {
                    const next = { ...prev };
                    for (const sku of skusToRun) next[String(sku)] = validationMethod;
                    return next;
                });

                console.log('Execute with indices:', { skuColIdx, startColIdx, endColIdx, selectedSkus, skusToRun });

                const fd = new FormData();
                fd.append('file', file);
                fd.append('sku_col_idx', skuColIdx);
                fd.append('start_col_idx', startColIdx);
                fd.append('end_col_idx', endColIdx);
                fd.append('data_format', 'horizontal');
                fd.append('model_type', 'auto');
                fd.append('validation_method', validationMethod);
                fd.append('train_horizon', parseInt(trainHorizon) || 24);
                fd.append('test_horizon', parseInt(testHorizon) || 6);
                fd.append('forecast_steps', parseInt(forecastSteps) || 6);
                fd.append('selected_skus', JSON.stringify(skusToRun));

                try {
                    const res = await fetch(`${BASE_URL}/batch_init`, { method: 'POST', body: fd });
                    if (generation !== runGenerationRef.current) return;
                    if (!res.ok) {
                        let message = "Failed to start job";
                        try {
                            const errBody = await res.json();
                            message = errBody.detail || errBody.message || message;
                        } catch (_) {}
                        setIsPolling(false);
                        setRunningSkus([]);
                        throw new Error(typeof message === 'string' ? message : "Failed to start job");
                    }
                    const data = await res.json();
                    if (generation !== runGenerationRef.current) return;
                    setJobId(data.job_id);
                } catch (e) {
                    if (generation !== runGenerationRef.current) return;
                    setIsPolling(false);
                    setRunningSkus([]);
                    setError(e.message);
                }
            };

            const handleExecute = async () => {
                if (!file || !skuCol || !startCol || !endCol) { setError("Please select file and map columns."); return; }
                if (skuColIdx < 0 || startColIdx < 0 || endColIdx < 0) { setError("Invalid column mapping. Please re-map columns."); return; }
                if (!selectedSkus.length) {
                    setAlertMessage(t('dashboard.select_required'));
                    return;
                }

                const completedSkus = new Set((batchResults || []).map((r) => String(r.sku)));
                const hasAlreadyProcessed = selectedSkus.some((sku) => completedSkus.has(String(sku)));
                if (hasAlreadyProcessed) {
                    setRerunConfirmOpen(true);
                    return;
                }

                await startBatchForSkus(selectedSkus);
            };

            const handleConfirmRerun = async () => {
                setRerunConfirmOpen(false);
                await startBatchForSkus(selectedSkus);
            };

            const handleExport = async () => {
                if (!file || !skuCol || !startCol || !endCol) { setError("Please load and map data first."); return; }
                if (isExporting) return;
                setIsExporting(true);

                // Use fast export if cached results are available
                if (batchResults && batchResults.length > 0) {
                    const fd = new FormData();
                    fd.append('file', file);
                    fd.append('validation_method', validationMethod);
                    fd.append('forecast_steps', parseInt(forecastSteps) || 6);
                    fd.append('sku_col_idx', skuColIdx);
                    fd.append('start_col_idx', startColIdx);
                    fd.append('end_col_idx', endColIdx);
                    fd.append('data_format', 'horizontal');
                    fd.append('cached_results', JSON.stringify(batchResults));
                    fd.append('job_id', jobId);

                    try {
                        const res = await fetch(`${BASE_URL}/export-fast`, { method: 'POST', body: fd });
                        if (!res.ok) throw new Error("Export failed");
                        const inputBaseName = file.name.replace(/\.[^/.]+$/, "");
                        const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                        let filename = `Operartis_Forecast_${inputBaseName}_${timestamp}.xlsx`;
                        const disposition = res.headers.get('Content-Disposition');
                        if (disposition && disposition.indexOf('attachment') !== -1) {
                            const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                            const matches = filenameRegex.exec(disposition);
                            if (matches != null && matches[1]) {
                                filename = matches[1].replace(/['"]/g, '');
                            }
                        }
                        const blob = await res.blob();
                        window.OperartisSecurity.downloadBlob(blob, filename);
                    } catch (e) { setError(e.message); }
                    finally { setIsExporting(false); }
                } else {
                    // Fallback to slow export if no cached results
                    const fd = new FormData();
                    fd.append('file', file);
                    fd.append('model_type', 'auto');
                    fd.append('validation_method', validationMethod);
                    fd.append('train_horizon', parseInt(trainHorizon) || 24);
                    fd.append('test_horizon', parseInt(testHorizon) || 6);
                    fd.append('forecast_steps', parseInt(forecastSteps) || 6);
                    fd.append('sku_col_idx', skuColIdx);
                    fd.append('start_col_idx', startColIdx);
                    fd.append('end_col_idx', endColIdx);
                    fd.append('data_format', 'horizontal');

                    try {
                        const res = await fetch(`${BASE_URL}/export`, { method: 'POST', body: fd });
                        if (!res.ok) throw new Error("Export failed");
                        const inputBaseName = file.name.replace(/\.[^/.]+$/, "");
                        const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                        let filename = `Operartis_Forecast_${inputBaseName}_${timestamp}.xlsx`;
                        const disposition = res.headers.get('Content-Disposition');
                        if (disposition && disposition.indexOf('attachment') !== -1) {
                            const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                            const matches = filenameRegex.exec(disposition);
                            if (matches != null && matches[1]) {
                                filename = matches[1].replace(/['"]/g, '');
                            }
                        }
                        const blob = await res.blob();
                        window.OperartisSecurity.downloadBlob(blob, filename);
                    } catch (e) { setError(e.message); }
                    finally { setIsExporting(false); }
                }
            };

            const handleReset = () => {
                setFile(null); setBatchResults(null); setJobId(null); setIsPolling(false); setError(null);
                setSkuCol(""); setStartCol(""); setEndCol("");
                setSkuColIdx(-1); setStartColIdx(-1); setEndColIdx(-1);
                setTotalTimeSeries(0); setAvailableCols([]);
                setSheetRows([]); setMappedSkus([]); setItemTabs([]);
                setSelectedSkus([]);
                setRunningSkus([]);
                setCurrentSku(null);
                setOverviewSearchQuery("");
                setActiveTab("overview");
                setSkuValidationMethods({});
                if (fileInputRef.current) fileInputRef.current.value = "";
            };

            const handleSkuSelect = (sku) => {
                if (batchResults && batchResults.find(r => r.sku === sku)) {
                    setCurrentSku(sku);
                    setItemTabs((prev) => (prev.includes(sku) ? prev : [...prev, sku]));
                    setActiveTab(sku);
                }
            };

            const handleToggleSkuSelection = useCallback((sku) => {
                setSelectedSkus((prev) => (
                    prev.includes(sku) ? prev.filter((s) => s !== sku) : [...prev, sku]
                ));
            }, []);

            const handleToggleSelectAll = useCallback(() => {
                setSelectedSkus((prev) => (
                    mappedSkus.length > 0 && prev.length === mappedSkus.length ? [] : [...mappedSkus]
                ));
            }, [mappedSkus]);

            const handleCloseItemTab = (sku) => {
                setItemTabs((prev) => prev.filter((s) => s !== sku));
                if (activeTab === sku) {
                    setActiveTab("overview");
                    setCurrentSku(null);
                }
            };

            const handleReorderItemTabs = useCallback((fromSku, toSku) => {
                setItemTabs((prev) => {
                    const from = prev.indexOf(fromSku);
                    const to = prev.indexOf(toSku);
                    if (from < 0 || to < 0 || from === to) return prev;
                    const next = [...prev];
                    const [moved] = next.splice(from, 1);
                    next.splice(to, 0, moved);
                    return next;
                });
            }, []);

            const cycleSku = (dir) => {
                if (!itemTabs.length) return;
                const current = activeTab !== 'overview' ? activeTab : currentSku;
                if (!current) return;
                const idx = itemTabs.indexOf(current);
                if (idx === -1) return;
                if (itemTabs.length === 1) return;
                let newIdx = idx + dir;
                if (newIdx < 0) newIdx = itemTabs.length - 1;
                if (newIdx >= itemTabs.length) newIdx = 0;
                const nextSku = itemTabs[newIdx];
                setCurrentSku(nextSku);
                setActiveTab(nextSku);
            };

            const getCurrentSkuData = () => {
                if (!batchResults) return null;
                const targetSku = activeTab !== 'overview' ? activeTab : currentSku;
                if (!targetSku) return null;
                return batchResults.find(r => r.sku === targetSku);
            };

            const skuData = getCurrentSkuData();
            const interfaceReady = !!(batchResults && batchResults.length > 0);
            const mappingReady = mappedSkus.length > 0;
            const isDetailTab = activeTab !== 'overview' && !!skuData;
            // Keep Run button in sync with Overview row status (not only the poll flag).
            const isRunning = isPolling || runningSkus.length > 0;

            const openDetailedView = () => {
                if (!interfaceReady || !batchResults?.length) return;
                const target = (currentSku && batchResults.find(r => r.sku === currentSku)?.sku)
                    || batchResults[0].sku;
                handleSkuSelect(target);
            };

            const overviewRows = useMemo(() => {
                if (!mappedSkus.length) return [];
                const resultMap = new Map((batchResults || []).map((r) => [String(r.sku), r]));
                const runningSet = new Set(runningSkus.map(String));
                return mappedSkus.map((sku) => {
                    const result = resultMap.get(sku);
                    const trackedMethod = skuValidationMethods[String(sku)] || null;
                    // While a SKU is re-running, never show stale metrics from a previous run.
                    if (runningSet.has(String(sku))) {
                        return {
                            sku,
                            status: 'running',
                            validation_method: trackedMethod,
                            best_ts_model: null,
                            mae_validation: null,
                            mse_validation: null,
                        };
                    }
                    if (result) {
                        return {
                            ...result,
                            status: 'success',
                            validation_method: result.validation_method || trackedMethod,
                        };
                    }
                    return {
                        sku,
                        status: 'not_run',
                        validation_method: null,
                        best_ts_model: null,
                        mae_validation: null,
                        mse_validation: null,
                    };
                });
            }, [mappedSkus, batchResults, runningSkus, skuValidationMethods]);

            const handleOverviewSearchChange = useCallback((value) => {
                setOverviewSearchQuery(value);
                setActiveTab("overview");
            }, []);

            const filteredOverviewRows = useMemo(() => {
                const q = overviewSearchQuery.trim().toLowerCase();
                if (!q) return overviewRows;
                return overviewRows.filter((r) => String(r.sku).toLowerCase().includes(q));
            }, [overviewRows, overviewSearchQuery]);

            // Synchronize Validation Data with Forecast Data Timeline
            const alignedValidationData = useMemo(() => {
                if (!skuData || !skuData.forecast_data || !skuData.validation_data) return null;
                const valMap = new Map(skuData.validation_data.map(d => [d.date, d]));
                return skuData.forecast_data.map(fd => {
                    const vd = valMap.get(fd.date);
                    return {
                        date: fd.date, // Use forecast date as master axis
                        actual_train: vd ? vd.actual_train : null,
                        actual_test: vd ? vd.actual_test : null,
                        fitted: vd ? vd.fitted : null,
                        val_forecast: vd ? vd.val_forecast : null
                    };
                });
            }, [skuData]);

            return (
                <div className="flex h-full min-h-0 bg-slate-50 dark:bg-slate-950 overflow-hidden relative w-full transition-colors duration-300 mobile-landscape-root">
                    <MappingModal headers={availableCols} isOpen={isMappingModalOpen} onClose={() => setIsMappingModalOpen(false)} onConfirm={handleMappingConfirm} t={t} />
                    <AlertModal
                        isOpen={!!alertMessage}
                        message={alertMessage || ''}
                        confirmLabel={t('dashboard.select_required_ok')}
                        onClose={() => setAlertMessage(null)}
                    />
                    <AlertModal
                        isOpen={rerunConfirmOpen}
                        message={t('dashboard.select_already_run')}
                        cancelLabel={t('dashboard.select_already_run_cancel')}
                        confirmLabel={t('dashboard.select_already_run_confirm')}
                        onClose={() => setRerunConfirmOpen(false)}
                        onConfirm={handleConfirmRerun}
                    />
                    {/* Mobile Sidebar Backdrop */}
                    {isSidebarOpen && (
                        <div
                            className="lg:hidden fixed inset-0 z-40 bg-slate-900/20 backdrop-blur-sm transition-opacity"
                            onClick={() => setIsSidebarOpen(false)}
                        />
                    )}

                    {/* SIDEBAR */}
                    <div className={`fc-sidebar-shell ${isFullScreen ? 'hidden' : ''} fixed lg:relative inset-y-0 left-0 z-50 w-64 ${isSidebarCollapsed ? 'lg:w-[76px]' : 'lg:w-64'} transform transition-all duration-300 ease-in-out ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>
                        <input ref={fileInputRef} type="file" className="hidden" accept=".xlsx,.xls" onChange={handleFileChange} />
                        <button
                            onClick={() => setIsSidebarCollapsed(prev => !prev)}
                            className="fc-sidebar-toggle hidden lg:flex items-center justify-center h-6 w-6 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 hover:text-brand-gold hover:border-brand-gold shadow-md transition-colors"
                            title={isSidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'}
                        >
                            {isSidebarCollapsed ? <ChevronRightIcon /> : <ChevronLeftIcon />}
                        </button>
                    <aside data-collapsed={isSidebarCollapsed ? 'true' : 'false'} className={`fc-sidebar flex w-full h-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-r border-white/20 dark:border-white/10 flex-col shadow-2xl lg:shadow-none`}>

                        <div className="h-16 flex items-center justify-center px-4 border-b border-white/20 dark:border-white/10 shrink-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md gap-2 relative sticky top-0 z-20">
                            <a href="./">
                                <img src="./icononly_transparent_nobuffer.png" className="h-8 w-8 md:h-10 md:w-10 object-contain cursor-pointer transition-transform hover:scale-110" onError={(e) => e.target.style.display = 'none'} />
                            </a>
                            <h1 className={`font-bold text-slate-800 dark:text-slate-100 tracking-tight text-base ${isSidebarCollapsed ? 'lg:hidden' : ''}`}>OPERARTIS</h1>
                            <button onClick={() => setIsSidebarOpen(false)} className="lg:hidden absolute right-4 text-slate-400"><XIcon /></button>
                        </div>

                        {isLargeScreen && isSidebarCollapsed && (
                        <div className="relative z-10 flex flex-1 flex-col items-center gap-3 pt-5 pb-4 min-h-0 pointer-events-auto">
                            <button
                                type="button"
                                onClick={() => fileInputRef.current?.click()}
                                className={`relative flex items-center justify-center h-11 w-11 rounded-xl border transition-all ${file ? (skuCol && startCol && endCol ? 'border-emerald-500/40 bg-emerald-500/10 text-emerald-500' : 'border-brand-gold/40 bg-amber-500/10 text-brand-gold') : 'border-slate-200 dark:border-slate-700 text-slate-400 hover:text-brand-gold hover:border-brand-gold'}`}
                                title={file ? file.name : t('sidebar.upload_label')}
                            >
                                <UploadIcon width="18" height="18" />
                                {file && <span className={`absolute -top-0.5 -right-0.5 h-2.5 w-2.5 rounded-full border-2 border-white dark:border-slate-900 ${skuCol && startCol && endCol ? 'bg-emerald-500' : 'bg-brand-gold'}`}></span>}
                            </button>
                            {file && (
                                <button
                                    onClick={() => setIsMappingModalOpen(true)}
                                    className="flex items-center justify-center h-11 w-11 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-400 hover:text-brand-gold hover:border-brand-gold transition-all"
                                    title={t('sidebar.edit_mapping')}
                                >
                                    <ColumnsIcon width="18" height="18" />
                                </button>
                            )}
                            <div className="h-px w-8 bg-slate-200 dark:bg-slate-700 my-1"></div>
                            <button
                                onClick={handleExecute}
                                disabled={!file || isRunning}
                                className={`flex items-center justify-center h-11 w-11 rounded-xl shadow-sm transition-all ${isRunning ? 'bg-amber-50 dark:bg-amber-950/40 text-brand-gold cursor-not-allowed' : !file ? 'bg-slate-100 dark:bg-slate-800 text-slate-400 cursor-not-allowed' : 'bg-brand-gold text-white hover:bg-brand-dark'}`}
                                title={isRunning ? t('sidebar.processing') : t('sidebar.execute_btn')}
                            >
                                {isRunning ? <RunningSpinnerIcon size={16} /> : <PlayIcon />}
                            </button>
                            <button
                                onClick={handleExport}
                                disabled={!file || !batchResults || isExporting || isRunning}
                                className={`flex items-center justify-center h-11 w-11 rounded-xl shadow-sm transition-all ${!file || !batchResults || isExporting || isRunning ? 'bg-slate-100 dark:bg-slate-800 text-slate-400 cursor-not-allowed' : 'bg-emerald-500 text-white hover:bg-emerald-600'}`}
                                title={isExporting ? t('sidebar.downloading') : t('sidebar.export_btn')}
                            >
                                {isExporting ? <RunningSpinnerIcon size={16} /> : <DownloadIcon />}
                            </button>
                            <button
                                onClick={handleReset}
                                className="mt-auto flex items-center justify-center h-11 w-11 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm text-slate-400 hover:text-red-500 hover:border-red-200 dark:hover:border-red-900/30 hover:bg-red-50/50 dark:hover:bg-red-950/20 transition-all box-border"
                                title={t('sidebar.reset_btn')}
                            >
                                <TrashIcon />
                            </button>
                        </div>
                        )}

                        {showExpandedSidebarContent && (
                        <div className="fc-sidebar-expanded flex-1 overflow-y-auto scroller px-3 pt-3 pb-0 gap-6 min-h-0 flex flex-col">
                            {/* 1. Source Data */}
                            <div>
                                <h3 className="text-xxs font-bold text-brand-gold uppercase tracking-widest mb-2 flex items-center gap-2">{t('sidebar.source_data')}<span className="h-px flex-1 bg-gradient-to-r from-brand-gold to-transparent"></span></h3>
                                <div className={`relative border border-dashed rounded-lg px-3 py-6 text-center transition-colors group ${file ? (skuCol && startCol && endCol ? 'border-emerald-500 bg-gradient-to-br from-emerald-500/10 to-teal-500/10' : 'border-brand-gold bg-amber-50/10') : 'border-slate-300 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer'}`}>
                                    <div onClick={() => !file && fileInputRef.current?.click()} className={!file ? "cursor-pointer flex flex-col items-center justify-center gap-2" : ""}>
                                        {file ? (
                                            <div className="flex flex-col items-center gap-1">
                                                <div onClick={() => fileInputRef.current?.click()} className="text-xs font-bold text-slate-700 dark:text-slate-200 truncate px-2 cursor-pointer hover:underline mb-1">{file.name}</div>
                                                <div className="text-[10px] text-emerald-500 font-bold uppercase">{skuCol && startCol && endCol ? t('sidebar.uploaded_mapped') : t('sidebar.action_required')}</div>
                                                <div className="flex gap-2 mt-2 justify-center">
                                                    <button
                                                        onClick={(e) => { e.stopPropagation(); fileInputRef.current?.click(); }}
                                                        className="inline-flex items-center justify-center w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 hover:text-brand-gold hover:bg-white dark:hover:bg-slate-700 shadow-sm transition-all"
                                                        title={t('sidebar.reupload_file')}
                                                    >
                                                        <UploadIcon width="14" height="14" />
                                                    </button>
                                                    <button
                                                        onClick={(e) => { e.stopPropagation(); setIsMappingModalOpen(true); }}
                                                        className="inline-flex items-center justify-center w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 hover:text-brand-gold hover:bg-white dark:hover:bg-slate-700 shadow-sm transition-all"
                                                        title={t('sidebar.edit_mapping')}
                                                    >
                                                        <ColumnsIcon width="14" height="14" />
                                                    </button>
                                                </div>
                                            </div>
                                        ) : (
                                            <>
                                                <UploadIcon className="w-8 h-8 text-slate-300 dark:text-slate-600 mb-1" />
                                                <div className="text-xs text-slate-500 font-medium">{t('sidebar.upload_label')}</div>
                                            </>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* 2. Configuration */}
                            <div className="border-t border-slate-100 dark:border-slate-800 pt-4">
                                <h3 className="text-xxs font-bold text-brand-gold uppercase tracking-widest mb-3 flex items-center gap-2">{t('sidebar.configuration')}<span className="h-px flex-1 bg-gradient-to-r from-brand-gold to-transparent"></span></h3>
                                <form className="space-y-4 bg-slate-50 dark:bg-slate-800/50 p-2 rounded-xl border border-slate-100 dark:border-slate-800" onSubmit={(e) => e.preventDefault()}>
                                    <div>
                                        <label className="text-xxs text-slate-500 dark:text-slate-400 font-bold block mb-1 uppercase">{t('sidebar.val_method')}</label>
                                        <div className="fc-sidebar-select-wrap">
                                            <select
                                                value={validationMethod}
                                                onChange={(e) => setValidationMethod(e.target.value)}
                                                className="fc-sidebar-control w-full text-xxs px-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 dark:text-slate-200 outline-none focus:border-brand-gold transition-colors dark:[color-scheme:dark]"
                                            >
                                                <option value="simple">Simple Split (Fast)</option>
                                                <option value="walk_forward">Walk-Forward (Adaptive)</option>
                                                <option value="rolling_window">Rolling Window (Adaptive)</option>
                                            </select>
                                            <svg className="fc-sidebar-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                                                <polyline points="6 9 12 15 18 9" />
                                            </svg>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="min-w-0 flex flex-col">
                                            <label className="text-xxs text-slate-500 dark:text-slate-400 font-bold block mb-1 uppercase leading-4 whitespace-nowrap overflow-hidden text-ellipsis" title={t('sidebar.train_h')}>{t('sidebar.train_h')}</label>
                                            <input
                                                type="number"
                                                value={trainHorizon}
                                                onChange={(e) => setTrainHorizon(e.target.value)}
                                                onBlur={() => setTrainHorizon(prev => Math.max(1, parseInt(prev) || 1).toString())}
                                                className={`fc-sidebar-control w-full text-xxs px-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 dark:text-slate-200 outline-none focus:border-brand-gold transition-colors dark:[color-scheme:dark] ${horizonMismatch ? 'border-red-400' : ''}`}
                                            />
                                        </div>
                                        <div className="min-w-0 flex flex-col">
                                            <label className="text-xxs text-slate-500 dark:text-slate-400 font-bold block mb-1 uppercase leading-4 whitespace-nowrap overflow-hidden text-ellipsis" title={t('sidebar.test_h')}>{t('sidebar.test_h')}</label>
                                            <input
                                                type="number"
                                                value={testHorizon}
                                                onChange={(e) => {
                                                    const newTest = parseInt(e.target.value) || 0;
                                                    setTestHorizon(e.target.value);
                                                    if (totalTimeSeries > 0 && newTest > 0 && newTest < totalTimeSeries) {
                                                        setTrainHorizon((totalTimeSeries - newTest).toString());
                                                    }
                                                }}
                                                onBlur={() => setTestHorizon(prev => Math.max(1, parseInt(prev) || 1).toString())}
                                                min="1"
                                                className={`fc-sidebar-control w-full text-xxs px-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 dark:text-slate-200 outline-none focus:border-brand-gold transition-colors dark:[color-scheme:dark] ${horizonMismatch ? 'border-red-400' : ''}`}
                                            />
                                        </div>
                                    </div>
                                    {totalTimeSeries > 0 && (
                                        <div className={`text-[9px] ${horizonMismatch ? 'text-red-500' : 'text-slate-400'}`}>
                                            {horizonMismatch
                                                ? `⚠️ ${t('sidebar.horizon_mismatch')} ${totalTimeSeries}`
                                                : `${t('sidebar.total_periods')}: ${totalTimeSeries}`
                                            }
                                        </div>
                                    )}
                                    <div className="pt-2 border-t border-slate-200 dark:border-slate-700">
                                        <label className="text-xxs text-slate-500 dark:text-slate-400 font-bold block mb-1 uppercase">{t('sidebar.fc_h')}</label>
                                        <input
                                            type="number"
                                            value={forecastSteps}
                                            onChange={(e) => setForecastSteps(e.target.value)}
                                            onBlur={() => setForecastSteps(prev => Math.max(1, parseInt(prev) || 1).toString())}
                                            min="1"
                                            className="fc-sidebar-control w-full text-xxs px-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 dark:text-slate-200 outline-none focus:border-brand-gold transition-colors dark:[color-scheme:dark]"
                                        />
                                    </div>
                                </form>
                            </div>

                            {/* 4. Action */}
                            <div className="border-t border-slate-100 dark:border-slate-800 pt-4">
                                <h3 className="text-xxs font-bold text-brand-gold uppercase tracking-widest mb-3 flex items-center gap-2">{t('sidebar.action')}<span className="h-px flex-1 bg-gradient-to-r from-brand-gold to-transparent"></span></h3>
                                <div className="space-y-2 bg-slate-50 dark:bg-slate-800/50 p-2 rounded-xl border border-slate-100 dark:border-slate-800">
                                    <button
                                        type="button"
                                        onClick={handleExecute}
                                        disabled={!file || isRunning}
                                        className={`w-full py-3 rounded-lg text-xs font-bold uppercase tracking-wide transition-all shadow-sm flex items-center justify-center gap-2 ${isRunning ? 'bg-amber-50 dark:bg-amber-950/40 text-brand-gold cursor-not-allowed' : !file ? 'bg-slate-100 dark:bg-slate-800 text-slate-400 cursor-not-allowed' : 'bg-brand-gold text-white shadow-lg shadow-brand-gold/20 hover:shadow-brand-gold/40 hover:bg-amber-600 hover:scale-[1.02] transform active:scale-95'}`}
                                    >
                                        {isRunning ? <RunningSpinnerIcon size={14} /> : <PlayIcon />}
                                        {isRunning ? t('sidebar.processing') : t('sidebar.execute_btn')}
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleExport}
                                        disabled={!file || !batchResults || isExporting || isRunning}
                                        className={`w-full py-3 rounded-lg text-xs font-bold uppercase tracking-wide transition-all shadow-sm flex items-center justify-center gap-2 ${!file || !batchResults || isExporting || isRunning ? 'bg-slate-100 dark:bg-slate-800 text-slate-400 cursor-not-allowed' : 'bg-emerald-500 text-white hover:bg-emerald-600 hover:scale-[1.02] shadow-emerald-500/20 hover:shadow-emerald-500/40'}`}
                                    >
                                        {isExporting ? <RunningSpinnerIcon size={14} /> : <DownloadIcon width="16" height="16" />}
                                        {isExporting ? t('sidebar.downloading') : t('sidebar.export_btn')}
                                    </button>
                                </div>
                            </div>

                            {/* Reset Button Area - Inside Body, Pushed to Bottom */}
                            <div className="pt-4 pb-1 !mt-auto">
                                <div className="p-2">
                                    <button type="button" onClick={handleReset} className="w-full py-3 rounded-lg text-xs font-bold uppercase tracking-wide transition-all shadow-sm flex items-center justify-center gap-2 text-slate-400 hover:text-red-500 border border-transparent hover:border-red-200 dark:hover:border-red-900/30 hover:bg-red-50/50 dark:hover:bg-red-950/20"><TrashIcon width="16" height="16" /> {t('sidebar.reset_btn')}</button>
                                </div>
                            </div>
                        </div>
                        )}


                        {showExpandedSidebarContent && (
                        <div className="fc-sidebar-expanded sticky bottom-0 z-20 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-t border-white/20 dark:border-white/10 shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.02)]">
                            <div className="p-4 text-center">
                                <p className="text-xs font-bold text-slate-700 dark:text-slate-200 uppercase tracking-wide">Operartis Analytics</p>
                                <p className="text-[10px] text-brand-gold mt-1 font-medium italic">Optimizing Today, Growing Tomorrow</p>
                            </div>
                        </div>
                        )}
                    </aside>
                    </div>

                    {/* MAIN CONTENT */}
                    <div className="flex flex-col flex-grow min-w-0 min-h-0 transition-all relative">
                        {/* Combined Header & Metrics Bar */}
                        <div className={`flex flex-col sticky top-0 z-30 shrink-0 ${isFullScreen ? 'hidden' : ''}`}>
                            <header className="fc-module-header h-16 bg-white/60 dark:bg-slate-900/60 backdrop-blur-md border-b border-white/20 dark:border-white/10 shrink-0 shadow-sm">
                                <div className="flex items-center justify-start min-h-[2.5rem]">
                                    <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="lg:hidden text-slate-500"><MenuIcon /></button>
                                </div>
                                <div className="fc-module-title text-[11px] sm:text-sm md:text-lg font-black text-transparent bg-clip-text bg-gradient-to-r from-brand-gold to-brand-dark uppercase tracking-widest">{t('header.title')}</div>
                                <div className="flex items-center justify-end gap-4 shrink-0 relative z-10">
                                    <div className="hidden sm:flex items-center gap-2 text-xs font-mono text-slate-500 dark:text-slate-400">
                                        {environmentBadge && (
                                            <div className={`hidden lg:flex items-center gap-1 px-1.5 py-0.5 rounded border bg-transparent text-[10px] font-bold uppercase tracking-wide ${environmentBadge.className}`} title={environmentBadge.title} aria-label={environmentBadge.title}><span className="w-3 h-3 flex shrink-0 [&_svg]:w-full [&_svg]:h-full"><ServerIcon /></span><span>{environmentBadge.label}</span></div>
                                        )}
                                    </div>
                                    <div id="operartis-auth-topbar-slot"></div>
                                </div>
                            </header>

                            {/* KPI BAR — with Overview tab after mapping confirm */}
                            {mappingReady && (
                            <div className="fc-kpi-shell min-h-12 sm:min-h-16 bg-white/60 dark:bg-slate-900/60 backdrop-blur-xl border-b border-white/20 dark:border-white/10 w-full shrink-0 shadow-sm overflow-hidden relative">
                                <KPICards results={batchResults} skuCount={mappedSkus.length} searchQuery={overviewSearchQuery} onSearchQueryChange={handleOverviewSearchChange} t={t} />
                            </div>
                            )}
                        </div>

                        <main className={`flex-grow flex flex-col bg-slate-50 dark:bg-slate-950 relative w-full min-h-0 overflow-hidden mobile-landscape-main ${isFullScreen ? 'hidden' : 'flex'}`}>

                            {/* CONTENT AREA */}
                            <div className="flex-1 min-h-0 p-2 md:px-4 md:pb-4 md:pt-2.5 relative overflow-y-auto scroller mobile-landscape-content">
                                {!mappingReady && (
                                    isPolling ? (
                                        <ForecastingLoader t={t} validationMethod={validationMethod} testHorizon={testHorizon} />
                                    ) : (
                                        <div className="h-full min-h-0 min-w-0 flex flex-col items-center justify-center pointer-events-none select-none" aria-hidden="true">
                                            <img
                                                src="./fulllogo_transparent_nobuffer.png"
                                                alt=""
                                                width="420"
                                                height="117"
                                                className="fc-empty-watermark object-contain"
                                            />
                                        </div>
                                    )
                                )}

                                {mappingReady && (
                                    <div className="h-full min-h-0 flex flex-col gap-2.5">
                                        <div className="shrink-0 min-w-0 w-full mt-2 md:mt-0">
                                            <ResultsTabBar
                                                activeTab={activeTab}
                                                itemTabs={itemTabs}
                                                onSelectOverview={() => setActiveTab('overview')}
                                                onSelectItem={(sku) => {
                                                    setCurrentSku(sku);
                                                    setActiveTab(sku);
                                                }}
                                                onCloseItem={handleCloseItemTab}
                                                onReorderItems={handleReorderItemTabs}
                                                t={t}
                                            />
                                        </div>
                                        <div className="flex-1 min-h-0">
                                            {activeTab === 'overview' && (
                                                <BatchOverview
                                                    results={filteredOverviewRows}
                                                    onSelectSku={handleSkuSelect}
                                                    selectedSkus={selectedSkus}
                                                    onToggleSku={handleToggleSkuSelection}
                                                    onToggleSelectAll={handleToggleSelectAll}
                                                    t={t}
                                                />
                                            )}
                                            {isDetailTab && skuData && (
                                                <div className="h-full w-full overflow-hidden max-md:bg-transparent md:border md:border-slate-200 md:dark:border-slate-800 md:rounded-lg md:bg-white md:dark:bg-slate-900 md:shadow-sm pt-4 px-3 pb-3 sm:pt-5 lg:p-4 lg:pt-5 mobile-compact-p relative flex flex-col min-h-0" key={layoutKey}>
                                                    <div className="flex flex-col h-full gap-2 mobile-landscape-chart-row mobile-compact-gap min-h-0">
                                                        {/* Dedicated toolbar — keeps SKU + metrics off the chart legend */}
                                                        <div className="shrink-0 flex flex-wrap items-center justify-between gap-2 min-w-0 px-0.5">
                                                            <div className="flex items-center gap-0.5 lg:gap-1 min-w-0 max-w-full sm:max-w-[55%] bg-slate-100/80 dark:bg-white/5 pl-0.5 pr-1.5 py-0.5 lg:pl-1 lg:pr-3 lg:py-1 rounded-full border border-slate-200/80 dark:border-white/10 shadow-sm">
                                                                <button type="button" onClick={() => cycleSku(-1)} className="shrink-0 p-0.5 lg:p-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full transition-colors text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200" aria-label="Previous SKU"><ChevronLeftIcon /></button>
                                                                <span className="min-w-0 truncate text-xs lg:text-lg font-black text-slate-800 dark:text-slate-100 tracking-tight mx-0.5 lg:mx-1" title={skuData.sku}>{skuData.sku}</span>
                                                                <button type="button" onClick={() => cycleSku(1)} className="shrink-0 p-0.5 lg:p-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full transition-colors text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200" aria-label="Next SKU"><ChevronRightIcon /></button>
                                                            </div>
                                                            <div className="flex items-center gap-2 lg:gap-4 shrink-0 bg-slate-100/80 dark:bg-white/5 px-2 py-1 lg:px-3 lg:py-1.5 rounded-lg lg:rounded-xl border border-slate-200/80 dark:border-white/10 shadow-sm">
                                                                <div className="flex flex-col items-center text-center max-w-[7.5rem] lg:max-w-none">
                                                                    <span className="text-[8px] lg:text-[10px] uppercase font-bold text-slate-400">{t('dashboard.table_validation')}</span>
                                                                    <span
                                                                        className="text-[10px] lg:text-xs font-bold text-slate-700 dark:text-slate-300 truncate max-w-full"
                                                                        title={formatValidationMethod(skuData.validation_method || skuValidationMethods[String(skuData.sku)], t)}
                                                                    >
                                                                        {formatValidationMethod(skuData.validation_method || skuValidationMethods[String(skuData.sku)], t)}
                                                                    </span>
                                                                </div>
                                                                <div className="flex flex-col items-center text-center">
                                                                    <span className="text-[8px] lg:text-[10px] uppercase font-bold text-slate-400">{t('dashboard.best_model')}</span>
                                                                    <span className="text-[10px] lg:text-xs font-bold text-brand-gold">{skuData.best_ts_model.toUpperCase()}</span>
                                                                </div>
                                                                <div className="flex flex-col items-center text-center">
                                                                    <span className="text-[8px] lg:text-[10px] uppercase font-bold text-slate-400">{t('dashboard.val_mse')}</span>
                                                                    <span className="text-[10px] lg:text-xs font-mono font-bold text-slate-700 dark:text-slate-300">{fmtNumber(skuData.mse_validation, 0, 0)}</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div className="flex-1 border-b border-dashed border-slate-200 dark:border-slate-700 relative mobile-landscape-chart-sep min-h-0">
                                                            <BacktestChart data={alignedValidationData} syncId="sv" isDark={isDark} t={t} />
                                                        </div>
                                                        <div className="flex-1 relative min-h-0">
                                                            <ForecastChart data={skuData.forecast_data} syncId="sv" isDark={isDark} t={t} />
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </main>
                    </div>

                    {/* FULL SCREEN */}


                    <SettingsModal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} baseUrl={BASE_URL} theme={theme} setTheme={setTheme} lang={lang} setLang={setLang} t={t} />
                </div>
            );
        };
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>

</html>
