                    info_mape: "Sai số phần trăm tuyệt đối trung bình: lấy trung bình của sai số tuyệt đối chia cho trị tuyệt đối của giá trị thực tế, rồi nhân 100. Giá trị thực tế bằng hoặc rất gần 0 được loại khỏi phép tính. Nếu không còn giá trị nào, MAPE không có; giá trị thực tế nhỏ có thể làm MAPE rất lớn.",

                                <span className="fc-replay-legend-item text-slate-500 dark:text-slate-400"><span className="fc-replay-legend-line is-train" aria-hidden="true" />{t('charts.act_train')}</span>
                                <span className="fc-replay-legend-item text-amber-600 dark:text-amber-400"><span className="fc-replay-legend-line is-forecast" aria-hidden="true" />{t('charts.val_fc')}</span>
                                <span className="fc-replay-legend-item text-emerald-600 dark:text-emerald-400"><span className="fc-replay-legend-line is-test" aria-hidden="true" />{t('charts.act_test')}</span>

                        </div>
                        <div className="fc-replay-chart-header-end">
                            <span role="status" className="text-xs font-semibold rounded-full px-3 py-1 bg-amber-50 dark:bg-amber-500/10 text-amber-700 dark:text-amber-400 shrink-0">{stage}</span>
                        </div>
                    </div>
                    <div className="fc-replay-chart w-full" aria-label={`${t('sidebar.replay_evaluation')} ${index + 1}: ${stage}`}>
                        <ResponsiveContainer width="100%" height="100%">
                            <ComposedChart data={chartData} margin={{ top: 8, right: 16, bottom: 24, left: 0 }}>
                                <CartesianGrid vertical={false} strokeDasharray="3 3" stroke={isDark ? '#334155' : '#e2e8f0'} />
                                <XAxis type="number" dataKey="position" domain={[0, chartMaxX]} allowDecimals={false} tickCount={6} tickFormatter={position => formatForecastDate(history[position]?.date || '', t.numberLocale)} tick={{ fill: tickColor, fontSize: 10 }} minTickGap={32} axisLine={false} tickLine={false} />
                                <YAxis domain={replay.domain} tickFormatter={value => formatChartAxis(value, t.numberLocale, true)} allowDataOverflow width={48} tick={{ fill: tickColor, fontSize: 10 }} axisLine={false} tickLine={false} />
                                <Tooltip wrapperClassName="fc-chart-tooltip-wrapper" cursor={{ stroke: isDark ? '#475569' : '#cbd5e1', strokeWidth: 1 }} content={<ChartTooltipContent locale={t.numberLocale} isDark={isDark} labelFormatter={position => history[position]?.date || ''} />} />
                                <ReferenceArea x1={fold.start} x2={fold.end} fill="#64748b" fillOpacity={0.08} ifOverflow="visible" label={(props) => (
                                    <ReplayWindowLabel
                                        viewBox={props.viewBox}
                                        labels={[t('sidebar.replay_training'), t('sidebar.replay_training_short'), t('sidebar.replay_training_abbrev')]}
                                        fill={isDark ? '#e2e8f0' : '#334155'}
                                        background={isDark ? 'rgba(51, 65, 85, 0.92)' : 'rgba(226, 232, 240, 0.94)'}
                                    />
                                )} />
                                <ReferenceArea x1={forecastX1} x2={forecastX2} fill="#f59e0b" fillOpacity={0.06} ifOverflow="visible" label={(props) => (
                                    <ReplayWindowLabel
                                        viewBox={props.viewBox}
                                        labels={[t('sidebar.replay_targets'), t('sidebar.replay_targets_short'), t('sidebar.replay_targets_abbrev')]}
                                        fill={isDark ? '#fde68a' : '#92400e'}
                                        background={isDark ? 'rgba(120, 53, 15, 0.92)' : 'rgba(254, 243, 199, 0.94)'}
                                    />
                                )} />
                                <ReferenceLine x={fold.end} stroke="#94a3b8" strokeDasharray="4 4" />
                                <Line type="linear" dataKey="training" name={t('charts.act_train')} stroke="#64748b" strokeWidth={2} dot={false} isAnimationActive={false} />
                                {/* Line animation hides dots until completion; a single point must stay visible across phases. */}
                                <Line type="linear" dataKey="forecast" name={t('charts.val_fc')} stroke="#f59e0b" strokeWidth={2} strokeDasharray="5 4" dot={singleForecast ? chartPointStyle('#f59e0b') : false} isAnimationActive={!singleForecast && !reducedMotion && playing} animationDuration={400 / speed} />
                                <Line type="linear" dataKey="actual" name={t('charts.act_test')} stroke="#10b981" strokeWidth={2} dot={singleForecast ? chartPointStyle('#10b981') : false} isAnimationActive={!singleForecast && !reducedMotion && playing} animationDuration={400 / speed} />
                            </ComposedChart>
                        </ResponsiveContainer>
                    </div>
                </div>
                <div className="fc-replay-metrics">
                    {['current', 'overall'].map(scope => <section key={scope} aria-label={t(`sidebar.replay_${scope}`)} className="fc-replay-metrics-card rounded-lg border border-slate-200 dark:border-slate-700 p-3">
                        <h4 className="text-[13px] font-semibold mb-3">{t(`sidebar.replay_${scope}`)}</h4>
                        <dl className="fc-replay-metrics-values">{['rmse', 'mae', 'mape'].map(metric => <div key={metric}><dt className="text-[10px] text-slate-500 dark:text-slate-400 uppercase">{metric}</dt><dd className="font-mono text-sm mt-1">{scope === 'current' && phase < 2 ? '—' : formatEvaluationValue(scope === 'current' ? fold.metrics[metric] : evaluationMetricValue(data, metric), metric, t.numberLocale)}</dd></div>)}</dl>
                    </section>)}
                </div>
                <div className="fc-replay-controls flex flex-wrap items-center justify-center gap-2 rounded-lg border border-slate-200 dark:border-slate-700 p-3">
                    <button type="button" className={control} aria-label={t(playing ? 'sidebar.replay_pause' : 'sidebar.replay_play')} title={t(playing ? 'sidebar.replay_pause' : 'sidebar.replay_play')} onClick={() => {
                        if (!playing && index === replay.folds.length - 1 && phase === 2) { setIndex(0); setPhase(0); }
                        setPlaying(!playing);
                    }}><ReplayControlIcon kind={playing ? 'pause' : 'play'} /></button>
                    <button type="button" className={control} aria-label={t('sidebar.replay_reset')} title={t('sidebar.replay_reset')} disabled={index === 0 && phase === 0 && !playing} onClick={() => { setPlaying(false); setIndex(0); setPhase(0); }}><ReplayControlIcon kind="reset" /></button>
                    <button type="button" className={control} aria-label={t('sidebar.replay_previous')} title={t('sidebar.replay_previous')} disabled={index === 0} onClick={() => selectFold(index - 1)}><ReplayControlIcon kind="previous" /></button>
                    <button type="button" className={control} aria-label={t('sidebar.replay_next')} title={t('sidebar.replay_next')} disabled={index === replay.folds.length - 1} onClick={() => selectFold(index + 1)}><ReplayControlIcon kind="next" /></button>
                    <label className="hidden md:flex items-center gap-3 text-xs flex-1 min-w-[180px] text-slate-500 dark:text-slate-400">
                        <span className="shrink-0 whitespace-nowrap">{t('sidebar.replay_evaluation')}</span>
                        <span className="fc-replay-slider-wrap">
                            {replay.folds.length > 1 && <span className="fc-replay-slider-ticks" aria-hidden="true">{replay.folds.map((_, tick) => <span key={tick} className={tick === index ? 'is-current' : undefined} />)}</span>}
                            <input type="range" min="0" max={replay.folds.length - 1} step="1" value={index} disabled={replay.folds.length === 1} onChange={event => selectFold(Number(event.target.value))} aria-label={t('sidebar.replay_evaluation')} aria-valuetext={`${index + 1} / ${replay.folds.length}`} className="fc-replay-slider" style={{ '--fc-replay-progress': `${replay.folds.length <= 1 ? 0 : (index / (replay.folds.length - 1)) * 100}%` }} />
                        </span>
                    </label>
                    <label className="flex items-center gap-2 text-xs" title={t('sidebar.replay_speed')}><ReplayControlIcon kind="speed" /><select aria-label={t('sidebar.replay_speed')} value={speed} onChange={event => setSpeed(Number(event.target.value))} className="rounded-md border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 p-1.5">{[0.5, 1, 2].map(value => <option key={value} value={value}>{fmtNumber(value, 0, 1, t.numberLocale)}×</option>)}</select></label>
                </div>
            </section>;
        };

        const InformationIcon = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" /><path d="M12 11v6" /><circle cx="12" cy="7.5" r="0.7" fill="currentColor" stroke="none" /></svg>;

        const ValidationInformationPanel = ({ mode, t, onClose }) => {
            const panelRef = useRef(null);
            const closeRef = useRef(null);
            useEffect(() => {
                const trigger = document.activeElement;
                const root = document.getElementById('root');
                const wasInert = root?.inert;
                const overflow = document.body.style.overflow;
                if (root) root.inert = true;
                document.body.style.overflow = 'hidden';
                closeRef.current?.focus();
                const handleKey = event => {
                    if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); onClose(); }
                    if (event.key !== 'Tab') return;
                    const focusable = [...panelRef.current.querySelectorAll('button, a[href], input, select, textarea, [tabindex]')]
                        .filter(node => !node.disabled && node.tabIndex >= 0 && node.getClientRects().length);
                    const first = focusable[0], last = focusable[focusable.length - 1];
                    if (event.shiftKey && (document.activeElement === first || !panelRef.current.contains(document.activeElement))) { event.preventDefault(); last?.focus(); }
                    else if (!event.shiftKey && (document.activeElement === last || !panelRef.current.contains(document.activeElement))) { event.preventDefault(); first?.focus(); }
                };
                document.addEventListener('keydown', handleKey, true);
                return () => {
                    document.removeEventListener('keydown', handleKey, true);
                    if (root) root.inert = wasInert;
                    document.body.style.overflow = overflow;
                    const returnTarget = trigger?.isConnected ? trigger : document.getElementById(`fc-validation-info-${mode}`);
                    returnTarget?.focus({ preventScroll: true });
                };
            }, [onClose]);
            const evaluation = mode === 'evaluation';
            const results = evaluation ? [['1', '15', '15.81', '15%'], ['2', '25', '29.15', '25%']] : [['1', '10', '10', '10%'], ['2', '30', '31.62', '30%']];
            const sectionClass = 'space-y-2';
            const headingClass = 'text-sm font-semibold text-slate-800 dark:text-slate-100';
            return ReactDOM.createPortal(<div className="fixed inset-0 z-[95] flex justify-end">
                <div className="absolute inset-0 bg-slate-950/20" onClick={onClose} aria-hidden="true" />
                <section ref={panelRef} id="validation-information-panel" role="dialog" aria-modal="true" aria-labelledby="validation-information-title" className="fc-information-drawer relative h-full w-full max-w-[420px] min-w-0 bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-700 shadow-2xl flex flex-col">
                    <header className="shrink-0 flex items-center justify-between gap-3 px-5 py-4 border-b border-slate-200 dark:border-slate-700">
                        <h2 id="validation-information-title" className="flex items-center gap-2 text-base font-semibold text-slate-800 dark:text-slate-100"><InformationIcon />{t('sidebar.info_panel')}</h2>
                        <button ref={closeRef} type="button" onClick={onClose} aria-label={t('sidebar.info_close')} title={t('sidebar.info_close')} className="w-8 h-8 shrink-0 inline-flex items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber-500"><XIcon /></button>
                    </header>
                    <div tabIndex={0} role="region" aria-label={t(`sidebar.validation_by_${mode}`)} className="flex-1 min-h-0 overflow-y-auto overscroll-contain scroller p-5 space-y-6 text-[13px] leading-6 text-slate-600 dark:text-slate-300 focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber-500">
                        <h3 className="text-lg font-semibold text-amber-700 dark:text-amber-400">{t(`sidebar.validation_by_${mode}`)}</h3>
                        <section className={sectionClass}><h4 className={headingClass}>{t('sidebar.info_meaning')}</h4><p>{t(`sidebar.info_meaning_${mode}`)}</p></section>
                        <section className={sectionClass}><h4 className={headingClass}>{t('sidebar.info_purpose')}</h4><p>{t(`sidebar.info_purpose_${mode}`)}</p></section>
                        <section className={sectionClass}><h4 className={headingClass}>{t('sidebar.info_reading')}</h4><p>{t(`sidebar.info_reading_${mode}`)}</p>
                            <dl className="space-y-2"><div><dt className="font-semibold">MAE</dt><dd>{t('sidebar.info_mae')}</dd></div><div><dt className="font-semibold">RMSE</dt><dd>{t('sidebar.info_rmse')}</dd></div><div><dt className="font-semibold">MAPE</dt><dd>{t('sidebar.info_mape')}</dd></div></dl>
                        </section>
                        <section className={sectionClass}><h4 className={headingClass}>{t('sidebar.info_example')}</h4><p>{t('sidebar.info_example_setup')}</p>
                            <table className="w-full border-separate border-spacing-0 text-xs text-right tabular-nums [&_th]:px-2 [&_th]:py-2 [&_td]:px-2 [&_td]:py-2" aria-label={t('sidebar.info_example_predictions')}>
                                <caption className="text-left font-semibold pb-2">{t('sidebar.info_example_predictions')}</caption>
                                <thead className="bg-slate-50 dark:bg-slate-800"><tr><th scope="col" className="text-left">{t('sidebar.replay_evaluation')}</th><th scope="col">{t('sidebar.info_lead_one')}</th><th scope="col">{t('sidebar.info_lead_two')}</th></tr></thead>
                                <tbody><tr><th scope="row" className="text-left font-normal">1</th><td>90</td><td>80</td></tr><tr><th scope="row" className="text-left font-normal">2</th><td>110</td><td>140</td></tr></tbody>
                            </table>
                            <p>{t(`sidebar.info_grouping_${mode}`)}</p>
                            <div className="bg-slate-50 dark:bg-slate-800 rounded-lg p-3 space-y-1 text-xs font-mono leading-6" aria-label={t('sidebar.info_calculation')}>
                                <p>MAE = {evaluation ? '(10 + 20) ÷ 2 = 15' : '(10 + 10) ÷ 2 = 10'}</p>
                                <p>RMSE = {evaluation ? `√[(10² + 20²) ÷ 2] ≈ ${fmtNumber(15.81, 0, 2, t.numberLocale)}` : '√[(10² + 10²) ÷ 2] = 10'}</p>
                                <p>MAPE = {evaluation ? '(10% + 20%) ÷ 2 = 15%' : '(10% + 10%) ÷ 2 = 10%'}</p>
                            </div>
                            <table className="w-full border-separate border-spacing-0 text-xs text-right tabular-nums [&_th]:px-2 [&_th]:py-2 [&_td]:px-2 [&_td]:py-2" aria-label={t('sidebar.info_example_scores')}>
                                <caption className="text-left font-semibold py-2">{t('sidebar.info_example_scores')}</caption>
                                <thead className="bg-slate-50 dark:bg-slate-800"><tr><th scope="col" className="text-left">{t(evaluation ? 'sidebar.replay_evaluation' : 'sidebar.validation_lead')}</th><th scope="col">MAE</th><th scope="col">RMSE</th><th scope="col">MAPE</th></tr></thead>
                                <tbody>{results.map(([row, mae, rmse, mape]) => <tr key={row}><th scope="row" className="text-left font-normal">{row}</th><td>{fmtNumber(mae, 0, 2, t.numberLocale)}</td><td>{fmtNumber(rmse, 0, 2, t.numberLocale)}</td><td>{mape}</td></tr>)}</tbody>
                            </table>
                            <p>{t(`sidebar.info_interpretation_${mode}`)}</p>
                        </section>
                        <section className={sectionClass}><h4 className={headingClass}>{t('sidebar.info_overall')}</h4><p>{t('sidebar.info_overall_body')}</p><p>{t('sidebar.info_cautions')}</p></section>
                    </div>
                </section>
            </div>, document.body);
        };

        const ValidationDetails = ({ data, t, onReplayEvaluation, onInformation }) => {
            const [view, setView] = useState('evaluation');
            const replay = useMemo(() => buildValidationReplay(data), [data]);
            const summary = data.validation_summary;
            if (!summary) return null;
            return <section className="shrink-0 text-[13px] leading-5 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 rounded-lg p-3 min-w-0" aria-label={t('sidebar.validation_details')}>
                <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                    <h3 className="font-semibold">{t('sidebar.validation_details')}</h3>
                    <div role="tablist" aria-label={t('sidebar.validation_breakdown')} className="flex flex-wrap gap-1">
                        {['evaluation', 'distance'].map(mode => <div key={mode} role="presentation" className="inline-flex items-center"><button type="button" role="tab" id={`fc-validation-tab-${mode}`} aria-controls={`fc-validation-panel-${mode}`} aria-selected={view === mode} tabIndex={view === mode ? 0 : -1}
                            onClick={() => setView(mode)} onKeyDown={event => {
                                if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
                                event.preventDefault();
                                const next = event.key === 'Home' ? 'evaluation' : event.key === 'End' ? 'distance' : mode === 'evaluation' ? 'distance' : 'evaluation';
                                setView(next); document.getElementById(`fc-validation-tab-${next}`)?.focus();
                            }}
                            className={`px-3 py-1.5 rounded-md text-xs font-semibold whitespace-nowrap focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber-500 ${view === mode ? 'bg-amber-50 text-amber-700 dark:bg-amber-500/10 dark:text-amber-400' : 'hover:bg-slate-100 dark:hover:bg-slate-800'}`}>{t(`sidebar.validation_by_${mode}`)}</button>
                            <button id={`fc-validation-info-${mode}`} type="button" onClick={() => onInformation(mode)} aria-label={`${t('sidebar.info_about')} ${t(`sidebar.validation_by_${mode}`)}`} title={`${t('sidebar.info_about')} ${t(`sidebar.validation_by_${mode}`)}`} aria-haspopup="dialog" aria-controls="validation-information-panel" className="w-7 h-7 inline-flex items-center justify-center rounded-full text-slate-400 hover:text-amber-600 dark:hover:text-amber-400 hover:bg-slate-100 dark:hover:bg-slate-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber-500"><InformationIcon /></button>
                        </div>)}
                    </div>
                </div>
                <p className="font-semibold">{t('sidebar.validation_counts').replace('{count}', fmtNumber(summary.evaluations, 0, 0, t.numberLocale)).replace('{horizon}', fmtNumber(summary.forecast_horizon, 0, 0, t.numberLocale)).replace('{pairs}', fmtNumber(summary.scored_pairs, 0, 0, t.numberLocale))}</p>
                <div className="mt-2 space-y-2">
                    {summary.scheme === 'fixed_horizon' && summary.evaluations < summary.max_evaluations && <p>{t('sidebar.validation_limited').replace('{max}', fmtNumber(summary.max_evaluations, 0, 0, t.numberLocale))}</p>}
                    <p>{t('sidebar.validation_final')}: {fmtNumber(data.final_training_periods, 0, 0, t.numberLocale)}</p>
                    <div key={view} role="tabpanel" id={`fc-validation-panel-${view}`} aria-labelledby={`fc-validation-tab-${view}`} tabIndex={0} className="focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber-500 rounded-md">
                        <p className="text-xs text-slate-500 dark:text-slate-400 mb-3">{t(`sidebar.validation_${view}_description`)}</p>
                        {view === 'evaluation' ? (replay ? <div className="min-w-0 overflow-x-auto scroller rounded-md" tabIndex={0} role="region" aria-label={t('sidebar.validation_by_evaluation')}>
                            <table className="fc-evaluation-table w-full border-separate border-spacing-0 text-right tabular-nums [&_th]:px-3 [&_th]:py-2 [&_td]:px-3 [&_td]:py-1.5" aria-label={t('sidebar.validation_by_evaluation')}>
                                <thead className="bg-slate-50 dark:bg-slate-800 [&_th]:font-semibold [&_th]:border-b [&_th]:border-slate-200 dark:[&_th]:border-slate-700"><tr>
                                    <th scope="col" className="text-left">{t('sidebar.replay_evaluation')}</th><th scope="col" className="text-left">{t('sidebar.validation_cutoff')}</th><th scope="col" className="text-left">{t('sidebar.validation_forecast_range')}</th><th scope="col">RMSE</th><th scope="col">MAE</th><th scope="col">MAPE</th>
                                </tr></thead>
                                <tbody>{replay.folds.map((fold, index) => <tr key={replay.history[fold.end].date} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                                    <th scope="row" className="text-left font-normal"><button type="button" onClick={() => onReplayEvaluation(index)} aria-label={`${t('sidebar.replay_evaluation')} ${index + 1}: ${t('sidebar.validation_open_replay')}`} title={t('sidebar.validation_open_replay')} className="inline-flex items-center gap-1.5 text-amber-700 dark:text-amber-400 underline underline-offset-2 rounded focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber-500">
                                        {index + 1}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10" /></svg>
                                    </button></th>
                                    <td className="text-left whitespace-nowrap">{formatForecastDate(replay.history[fold.end].date, t.numberLocale)}</td>
                                    <td className="text-left whitespace-nowrap">{formatForecastDate(replay.history[fold.end + 1].date, t.numberLocale)} → {formatForecastDate(replay.history[fold.end + fold.points.length].date, t.numberLocale)}</td>
                                    <td>{fmtNumber(fold.metrics.rmse, 1, 1, t.numberLocale)}</td><td>{fmtNumber(fold.metrics.mae, 1, 1, t.numberLocale)}</td><td>{formatEvaluationValue(fold.metrics.mape, 'mape', t.numberLocale)}</td>
                                </tr>)}</tbody>
                            </table>
                        </div> : <p className="py-3">{t('sidebar.validation_evaluation_unavailable')}</p>) : <table role="table" aria-label={t('sidebar.validation_by_distance')} className="fc-validation-table w-full border-separate border-spacing-0 text-right tabular-nums [&_td]:px-3 [&_td]:py-1">
                            <thead role="rowgroup" className="rounded-t-md bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 [&_th]:px-3 [&_th]:py-2 [&_th]:font-semibold">
                                <tr role="row"><th role="columnheader" scope="col" className="text-left">{t('sidebar.validation_lead')}</th><th role="columnheader" scope="col">RMSE</th><th role="columnheader" scope="col">MAE</th><th role="columnheader" scope="col">MAPE</th></tr>
                            </thead>
                            <tbody role="rowgroup" className="rounded-b-md">{(summary.metrics_by_lead || []).map(metric => <tr role="row" key={metric.lead}><td role="cell" className="text-left">{metric.lead}</td><td role="cell">{fmtNumber(metric.rmse, 1, 1, t.numberLocale)}</td><td role="cell">{fmtNumber(metric.mae, 1, 1, t.numberLocale)}</td><td role="cell">{formatEvaluationValue(metric.mape, 'mape', t.numberLocale)}</td></tr>)}</tbody>
                        </table>}
                    </div>
                </div>
            </section>;
        };

        const ForecastRunSummary = ({ data, t }) => {
            const summary = data.validation_summary || {};
            const history = (data.forecast_data || []).filter(point => point.actual_history != null);
            const frequency = inferFrequencyFromHeaders(history.map(point => point.date));
            const futureCount = (data.forecast_data || []).filter(point => point.future_forecast != null).length;
            const requestedModels = formatForecastModelList(data.requested_models, data.requested_model, t);
            const fields = [
                { label: t('sidebar.models_requested'), value: requestedModels, valueClassName: 'text-xs font-normal text-slate-600 dark:text-slate-300 break-words' },
                { label: t('sidebar.detected_frequency'), value: frequency === 'unsupported' ? '—' : t(`sidebar.freq_${frequency}`) },
                { label: t('sidebar.train_h'), value: summary.training_window == null ? '—' : fmtNumber(summary.training_window, 0, 0, t.numberLocale) },
                { label: t('sidebar.test_h'), value: summary.validation_period == null ? '—' : fmtNumber(summary.validation_period, 0, 0, t.numberLocale) },
                { label: t('sidebar.fc_h'), value: futureCount ? fmtNumber(futureCount, 0, 0, t.numberLocale) : '—' },
                { label: t('sidebar.eval_metric'), value: data.evaluation_metric?.toUpperCase() || '—' },
            ];
            const defaultValueClassName = 'font-medium text-slate-700 dark:text-slate-200 break-words';
            return <section className="shrink-0 rounded-lg border border-slate-200 dark:border-slate-700 p-3 text-[13px] leading-5 text-slate-600 dark:text-slate-300" aria-label={t('sidebar.detail_process')}>
                <h3 className="font-semibold text-slate-700 dark:text-slate-200 mb-2">{t('sidebar.detail_process')}</h3>
                <dl className="grid grid-cols-2 lg:grid-cols-3 gap-x-4 gap-y-3">

        const ModelSelectionNotice = ({ data, t }) => {
            const requested = (data.requested_models?.length ? data.requested_models : [data.requested_model]).filter(Boolean).join(', ');
            const seasonal = data.model_configuration?.seasonal;

                {data.fallback_reason && <>
                    <p className="font-semibold text-amber-700 dark:text-amber-400">{t('sidebar.model_substitution')}</p>
                    <p>{t('sidebar.models_requested')}: <span className="uppercase">{requested || '—'}</span></p>
                    {data.initially_selected_model && <p>{t('sidebar.model_initial')}: <span className="uppercase">{data.initially_selected_model}</span></p>}
                    <p>{t('sidebar.model_used')}: <span className="uppercase font-semibold">{data.best_ts_model}</span></p>
                    <p className="break-words">{t('sidebar.model_reason')}: {data.fallback_reason}</p>
                </>}
                {seasonal && <p>{t('sidebar.model_variant')}: {t(`sidebar.seasonal_${seasonal}`)}</p>}

        };

        const ForecastValuesTable = memo(({ data, t }) => {
            const sectionRef = useRef(null);
            const scrollRef = useRef(null);
            const forecasts = (data || []).filter(point => point.date && point.future_forecast != null);
            const hasForecasts = forecasts.length > 0;

            useEffect(() => {
                const section = sectionRef.current;
                const scroller = scrollRef.current;
                if (!section || !scroller) return;
                const handleWheel = (event) => {
                    if (event.ctrlKey || event.metaKey) return;
                    const maxScroll = scroller.scrollWidth - scroller.clientWidth;
                    if (maxScroll <= 1) return;
                    const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
                    if (!delta) return;
                    const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? scroller.clientWidth : 1;
                    // Consume the wheel even at either end so the surrounding
                    // detail panel does not jump vertically while browsing values.
                    event.preventDefault();
                    event.stopPropagation();
                    scroller.scrollLeft = Math.max(0, Math.min(maxScroll, scroller.scrollLeft + delta * unit));
                };
                section.addEventListener('wheel', handleWheel, { passive: false });
                return () => section.removeEventListener('wheel', handleWheel);
            }, [hasForecasts]);

            if (!hasForecasts) return null;
            return (
                <section ref={sectionRef} className="fc-forecast-values shrink-0 min-w-0 rounded-lg border border-slate-200 dark:border-slate-700 p-3 text-[13px] leading-5 text-slate-600 dark:text-slate-300" aria-label={t('charts.forecast_values')}>
                    <h3 className="mb-2 font-semibold">{t('charts.forecast_values')}</h3>
                    <div ref={scrollRef} className="min-w-0 scroller overflow-x-auto rounded-md focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber-500" tabIndex={0} role="region" aria-label={t('charts.forecast_values')}>
                        <table className="fc-forecast-values-table w-full border-separate border-spacing-0 text-right tabular-nums" aria-label={t('charts.forecast_values')}>
                            <thead>
                                <tr>
                                    <th scope="col" className="sticky left-0 z-10 bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-3 py-2 text-left font-semibold">{t('charts.period')}</th>
                                    {forecasts.map(point => (
                                        <th scope="col" key={point.date} className="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-3 py-2 font-semibold">{formatForecastDate(point.date, t.numberLocale)}</th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <th scope="row" className="sticky left-0 z-10 bg-white dark:bg-slate-900 px-3 py-2 text-left font-semibold">{t('charts.future_fc')}</th>
                                    {forecasts.map(point => (
                                        <td key={point.date} className="px-3 py-2">{fmtNumber(point.future_forecast, 0, 6, t.numberLocale)}</td>
                                    ))}
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            );
        });

        const KPICards = memo(({ results, skuCount = 0, t }) => {
            const hasData = results && results.length > 0;

            const { totalSeries, avgMape, avgRmse, avgMae, totalForecastVolume } = useMemo(() => {
                if (!hasData) {
                    return {
                        totalSeries: skuCount > 0 ? skuCount : '-',
                        avgMape: '-',
                        avgRmse: '-',
                        avgMae: '-',
                        totalForecastVolume: '-',
                    };
                }

                const total = results.length;
                const fcVolume = results.reduce((sum, r) => {
                    const fcSum = r.forecast_data ? r.forecast_data.reduce((s, d) => s + (d.future_forecast || 0), 0) : 0;
                    return sum + fcSum;
                }, 0);

                return {
                    totalSeries: skuCount > 0 ? skuCount : total,
                    avgMape: averageEvaluationMetric(results, 'mape'),
                    avgRmse: averageEvaluationMetric(results, 'rmse'),
                    avgMae: averageEvaluationMetric(results, 'mae'),
                    totalForecastVolume: fcVolume
                };
            }, [results, hasData, skuCount]);

            return (
                <div className="fc-kpi-bar min-h-10 sm:min-h-12">
                    <div className="fc-kpi-metrics min-h-10 sm:min-h-12" id="fc-kpi-metrics">
                        <MetricTile label={t('dashboard.total_skus')} shortLabel={t('dashboard.total_skus_short')} value={fmtNumber(totalSeries, 0, 0, t.numberLocale)} preserveLabelCase />
                        <MetricTile label={t('dashboard.total_vol')} shortLabel={t('dashboard.total_vol_short')} value={fmtNumber(totalForecastVolume, 0, 0, t.numberLocale)} />
                        <MetricTile label={t('dashboard.avg_mape')} shortLabel={t('dashboard.avg_mape_short')} value={formatEvaluationValue(avgMape, 'mape', t.numberLocale)} />
                        <MetricTile label={t('dashboard.avg_rmse')} shortLabel={t('dashboard.avg_rmse_short')} value={formatEvaluationValue(avgRmse, 'rmse', t.numberLocale)} />
                        <MetricTile label={t('dashboard.avg_mae')} shortLabel={t('dashboard.avg_mae_short')} value={formatEvaluationValue(avgMae, 'mae', t.numberLocale)} />
                    </div>
                </div>
            );
        });



        const StatusBadge = ({ status, t }) => {
            const base = "inline-flex items-center justify-center gap-1 min-w-[6.75rem] px-2 py-0.5 rounded-full text-[10px] font-bold uppercase whitespace-nowrap";
            if (status === 'success') {
                return (
                    <span className={`${base} bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300`}>
                        <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12" /></svg>
                        {t('dashboard.table_success')}
                    </span>
                );
            }
            if (status === 'failed') {
                return (
                    <span className={`${base} bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300`}>
                        <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
                        {t('dashboard.table_failed')}
                    </span>
                );
            }
            if (status === 'running') {
                return (
                    <span className={`${base} fc-status-active`}>
                        <RunningSpinnerIcon size={10} />
                        {t('dashboard.table_running')}
                    </span>
                );
            }
            return (
                <span className={`${base} bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400`}>
                    {t('dashboard.table_not_run')}
                </span>
            );
        };

        const formatValidationMethod = (method, t) => {
            if (!method) return '-';
            const key = `dashboard.validation_${method}`;
            const label = t(key);
            return label === key ? String(method) : label;
        };

        const ResultsTabBar = memo(({ activeTab, itemTabs, onSelectOverview, onSelectItem, onCloseItem, onReorderItems, t }) => {
            const [dragSku, setDragSku] = useState(null);
            const [overSku, setOverSku] = useState(null);
            const tabsRef = useRef(null);
            const tabBtnRefs = useRef({});

            const scrollTabIntoView = useCallback((tabKey) => {
                if (tabKey === 'overview') return;
                const container = tabsRef.current;
                const el = tabBtnRefs.current[tabKey];
                if (!container || !el) return;
                // Scroll only the item-tab strip — avoid nudging the page.
                requestAnimationFrame(() => {
                    const cRect = container.getBoundingClientRect();
                    const eRect = el.getBoundingClientRect();
                    const pad = 8;
                    if (eRect.left < cRect.left + pad) {
                        container.scrollLeft -= (cRect.left + pad) - eRect.left;
                    } else if (eRect.right > cRect.right - pad) {
                        container.scrollLeft += eRect.right - (cRect.right - pad);
                    }
                });
            }, []);

            useEffect(() => {
                scrollTabIntoView(activeTab);
            }, [activeTab, itemTabs, scrollTabIntoView]);

            // Vertical mouse wheel → horizontal scroll of item tabs only.
            useEffect(() => {
                const el = tabsRef.current;
                if (!el) return;
                const onWheel = (e) => {
                    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
                    if (!delta) return;
                    const maxScroll = el.scrollWidth - el.clientWidth;
                    if (maxScroll <= 0) return;
                    const next = Math.max(0, Math.min(maxScroll, el.scrollLeft + delta));
                    if (next !== el.scrollLeft) {
                        e.preventDefault();
                        el.scrollLeft = next;
                    }
                };
                el.addEventListener('wheel', onWheel, { passive: false });
                return () => el.removeEventListener('wheel', onWheel);
            }, []);

            const handleDragStart = (e, sku) => {
                setDragSku(sku);
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', sku);
            };

            const handleDragOver = (e, sku) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                if (sku !== overSku) setOverSku(sku);
            };

            const handleDragLeave = (e, sku) => {
                if (!e.currentTarget.contains(e.relatedTarget)) {
                    setOverSku((prev) => (prev === sku ? null : prev));
                }
            };

            const handleDrop = (e, targetSku) => {
                e.preventDefault();
                const source = dragSku || e.dataTransfer.getData('text/plain');
                if (source && targetSku && source !== targetSku) {
                    onReorderItems?.(source, targetSku);
                }
                setDragSku(null);
                setOverSku(null);
            };

            const handleDragEnd = () => {
                setDragSku(null);
                setOverSku(null);
            };

            return (
                <div className="fc-results-tabs" role="tablist" aria-label={t('dashboard.batch_overview')}>
                    <button
                        type="button"
                        role="tab"
                        aria-selected={activeTab === 'overview'}
                        onClick={onSelectOverview}
                        className={`fc-results-tab fc-results-tab-overview ${activeTab === 'overview' ? 'is-active' : ''}`}
                    >
                        {t('dashboard.batch_overview')}
                    </button>
                    <div ref={tabsRef} className="fc-results-tabs-scroll">
                        {itemTabs.map((sku) => (
                            <button
                                key={sku}
                                type="button"
                                role="tab"
                                ref={(node) => { tabBtnRefs.current[sku] = node; }}
                                draggable
                                aria-selected={activeTab === sku}
                                onClick={() => {
                                    onSelectItem(sku);
                                    scrollTabIntoView(sku);
                                }}
                                onDragStart={(e) => handleDragStart(e, sku)}
                                onDragOver={(e) => handleDragOver(e, sku)}
                                onDragLeave={(e) => handleDragLeave(e, sku)}
                                onDrop={(e) => handleDrop(e, sku)}
                                onDragEnd={handleDragEnd}
                                className={`fc-results-tab is-draggable ${activeTab === sku ? 'is-active' : ''} ${dragSku === sku ? 'is-dragging' : ''} ${overSku === sku && dragSku !== sku ? 'is-drop-target' : ''}`}
                                title={sku}
                            >
                                <span className="max-w-[9rem] truncate font-mono text-[12px]">{sku}</span>
                                <span
                                    role="button"
                                    tabIndex={0}
                                    draggable={false}
                                    className="fc-results-tab-close"
                                    aria-label={`Close ${sku}`}
                                    onClick={(e) => { e.stopPropagation(); onCloseItem(sku); }}
                                    onMouseDown={(e) => e.stopPropagation()}
                                    onKeyDown={(e) => {
                                        if (e.key === 'Enter' || e.key === ' ') {
                                            e.preventDefault();
                                            e.stopPropagation();
                                            onCloseItem(sku);
                                        }
                                    }}
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
                                </span>
                            </button>
                        ))}
                    </div>
                </div>
            );
        });

        const BatchOverview = memo(({ results, onSelectSku, selectedSkus, onToggleSku, onToggleSelectAll, evaluationMetric = 'rmse', t }) => {
            const formatMetric = (value, code) => formatEvaluationValue(value, code, t.numberLocale);
            const contestCode = normalizeContestMetric(evaluationMetric);
            const selectAllDesktopRef = useRef(null);
            const selectAllMobileRef = useRef(null);
            const selectedSet = useMemo(() => new Set(selectedSkus), [selectedSkus]);
            const allSelected = results.length > 0 && selectedSkus.length === results.length;
            const someSelected = selectedSkus.length > 0 && !allSelected;
            const [sortKey, setSortKey] = useState('sku');
            const [sortDir, setSortDir] = useState('asc');
            const [sortMenuOpen, setSortMenuOpen] = useState(false);

            const sortOptions = useMemo(() => ([
                { key: 'sku', label: t('dashboard.table_sku') },
                { key: 'status', label: t('dashboard.table_status') },
                { key: 'validation', label: t('dashboard.table_validation') },
                { key: 'model', label: t('dashboard.table_best_model') },
                { key: 'mape', label: t('dashboard.table_mape') },
                { key: 'rmse', label: t('dashboard.table_rmse') },
                { key: 'mae', label: t('dashboard.table_mae') },
            ]), [t]);

            const activeSortLabel = useMemo(() => {
                const match = sortOptions.find((opt) => opt.key === sortKey);
                return match ? match.label : t('dashboard.table_sku');
            }, [sortOptions, sortKey, t]);

            useEffect(() => {
                if (selectAllDesktopRef.current) selectAllDesktopRef.current.indeterminate = someSelected;
                if (selectAllMobileRef.current) selectAllMobileRef.current.indeterminate = someSelected;
            }, [someSelected]);

            const handleSort = useCallback((key) => {
                setSortKey((prev) => {
                    if (prev === key) {
                        setSortDir((d) => (d === 'asc' ? 'desc' : 'asc'));
                        return prev;
                    }
                    setSortDir('asc');
                    return key;
                });
            }, []);

            const handleSortPick = useCallback((key) => {
                handleSort(key);
                setSortMenuOpen(false);
            }, [handleSort]);

            const sortedResults = useMemo(() => {
                const statusRank = { success: 3, running: 2, not_run: 1, failed: 0 };
                const dir = sortDir === 'asc' ? 1 : -1;
                const toNum = (v) => (v == null || v === '' || Number.isNaN(Number(v)) ? null : Number(v));
                const toStr = (v) => String(v == null ? '' : v).toLowerCase();

                return [...results].sort((a, b) => {
                    let cmp = 0;
                    if (sortKey === 'sku') {
                        cmp = toStr(a.sku).localeCompare(toStr(b.sku), undefined, { numeric: true, sensitivity: 'base' });
                    } else if (sortKey === 'status') {
                        cmp = (statusRank[a.status] ?? -1) - (statusRank[b.status] ?? -1);
                    } else if (sortKey === 'validation') {
                        cmp = toStr(a.validation_method || '').localeCompare(toStr(b.validation_method || ''), undefined, { sensitivity: 'base' });
                    } else if (sortKey === 'model') {
                        cmp = toStr(a.best_ts_model || '').localeCompare(toStr(b.best_ts_model || ''), undefined, { sensitivity: 'base' });
                    } else if (sortKey === 'mape' || sortKey === 'rmse' || sortKey === 'mae') {
                        const av = evaluationMetricValue(a, sortKey);
                        const bv = evaluationMetricValue(b, sortKey);
                        if (av == null && bv == null) cmp = 0;
                        else if (av == null) cmp = 1;
                        else if (bv == null) cmp = -1;
                        else cmp = av - bv;
                    }
                    if (cmp === 0) {
                        cmp = toStr(a.sku).localeCompare(toStr(b.sku), undefined, { numeric: true, sensitivity: 'base' });
                    }
                    return cmp * dir;
                });
            }, [results, sortKey, sortDir]);

            const SortHeader = ({ columnKey, label, align = 'left', thClassName = '' }) => {
                const active = sortKey === columnKey;
                const alignClass = align === 'right' ? 'justify-end text-right' : align === 'center' ? 'justify-center text-center' : 'justify-start text-left';
                return (
                    <th className={`p-2 lg:p-3 font-bold text-slate-500 dark:text-slate-400 uppercase ${align === 'right' ? 'text-right' : align === 'center' ? 'text-center' : ''} ${thClassName}`}>
                        <button
                            type="button"
                            onClick={() => handleSort(columnKey)}
                            className={`inline-flex items-center gap-1 max-w-full ${alignClass} hover:text-slate-700 dark:hover:text-slate-200 transition-colors ${active ? 'text-brand-gold dark:text-brand-gold' : ''}`}
                            aria-sort={active ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'}
                        >
                            <span className="truncate">{label}</span>
                            <span className={`shrink-0 text-[9px] leading-none ${active ? 'opacity-100' : 'opacity-35'}`} aria-hidden="true">
                                {active ? (sortDir === 'asc' ? '▲' : '▼') : '↕'}
                            </span>
                        </button>
                    </th>
                );
            };

            const mobileCards = useMemo(() => sortedResults.map((r, i) => {
                const isReady = r.status === 'success';
                const isChecked = selectedSet.has(r.sku);
                const validationLabel = formatValidationMethod(r.validation_method, t);
                return (
                    <div
                        key={r.sku || i}
                        className={`w-full text-left rounded-xl border border-slate-200/80 dark:border-slate-800 bg-white dark:bg-slate-900/80 p-3 shadow-sm transition-transform ${isReady ? 'active:scale-[0.99]' : 'opacity-95'}`}
                    >
                        <div className="flex items-start justify-between gap-2 mb-2">
                            <label className="inline-flex items-start gap-2 min-w-0" onClick={(e) => e.stopPropagation()}>
                                <input
                                    type="checkbox"
                                    className="fc-row-check mt-0.5"
                                    checked={isChecked}
                                    onChange={() => onToggleSku(r.sku)}
                                    aria-label={`${t('dashboard.table_select')} ${r.sku}`}
                                />
                                <button
                                    type="button"
                                    onClick={() => isReady && onSelectSku(r.sku)}
                                    disabled={!isReady}
                                    className={`font-mono font-bold text-sm text-left break-all leading-tight ${isReady ? 'text-slate-800 dark:text-slate-100' : 'text-slate-800 dark:text-slate-100 cursor-default'}`}
                                >
                                    {r.sku}
                                </button>
                            </label>
                            <StatusBadge status={r.status} t={t} />
                        </div>
                        <button
                            type="button"
                            onClick={() => isReady && onSelectSku(r.sku)}
                            disabled={!isReady}
                            className={`w-full text-left ${isReady ? '' : 'cursor-default'}`}
                        >
                            <div className="grid grid-cols-2 gap-2 mb-3">
                                <div className="min-w-0">
                                    <span className="text-[9px] font-bold uppercase tracking-wide text-slate-400">{t('dashboard.table_validation')}</span>
                                    <p className="mt-0.5 text-xs font-semibold text-slate-600 dark:text-slate-300 truncate" title={validationLabel}>{validationLabel}</p>
                                </div>
                                <div className="min-w-0">
                                    <span className="text-[9px] font-bold uppercase tracking-wide text-slate-400">{t('dashboard.table_best_model')}</span>
                                    <p className="mt-0.5 text-xs font-semibold uppercase text-slate-600 dark:text-slate-300 truncate" title={r.fallback_reason || r.best_ts_model || ''}>{r.best_ts_model || '-'}</p>{r.fallback_reason && <span className="block text-[10px] font-semibold text-amber-700 dark:text-amber-400">{t('sidebar.model_substitution')}</span>}
                                </div>
                            </div>
                            <div className="grid grid-cols-3 gap-2">
                                <div className="rounded-lg border border-slate-200/70 dark:border-slate-800 bg-slate-50/80 dark:bg-slate-950/50 px-2.5 py-2">
                                    <span className="block text-[9px] font-bold uppercase tracking-wide text-slate-400">{t('dashboard.table_mape')}</span>
                                    <span className="mt-0.5 block font-mono font-bold text-sm text-slate-700 dark:text-slate-200">{formatMetric(evaluationMetricValue(r, 'mape'), 'mape')}</span>
                                </div>
                                <div className="rounded-lg border border-slate-200/70 dark:border-slate-800 bg-slate-50/80 dark:bg-slate-950/50 px-2.5 py-2">
                                    <span className="block text-[9px] font-bold uppercase tracking-wide text-slate-400">{t('dashboard.table_rmse')}</span>
                                    <span className={`mt-0.5 block font-mono font-bold text-sm ${rowContestMetric(r, contestCode) === 'rmse' ? 'text-amber-600 dark:text-amber-400' : 'text-slate-700 dark:text-slate-200'}`}>{formatMetric(evaluationMetricValue(r, 'rmse'), 'rmse')}</span>
                                </div>
                                <div className="rounded-lg border border-slate-200/70 dark:border-slate-800 bg-slate-50/80 dark:bg-slate-950/50 px-2.5 py-2">
                                    <span className="block text-[9px] font-bold uppercase tracking-wide text-slate-400">{t('dashboard.table_mae')}</span>
                                    <span className={`mt-0.5 block font-mono font-bold text-sm ${rowContestMetric(r, contestCode) === 'mae' ? 'text-amber-600 dark:text-amber-400' : 'text-slate-700 dark:text-slate-200'}`}>{formatMetric(evaluationMetricValue(r, 'mae'), 'mae')}</span>
                                </div>
                            </div>
                        </button>
                    </div>
                );
            }), [sortedResults, onSelectSku, onToggleSku, selectedSet, t, contestCode]);

            const tableRows = useMemo(() => sortedResults.map((r, i) => {
                const isReady = r.status === 'success';
                const isChecked = selectedSet.has(r.sku);
                const validationLabel = formatValidationMethod(r.validation_method, t);
                return (
                    <tr
                        key={r.sku || i}
                        role={isReady ? 'button' : undefined}
                        tabIndex={isReady ? 0 : undefined}
                        onClick={() => isReady && onSelectSku(r.sku)}
                        onKeyDown={(e) => {

            return (

                    <div className="fc-overview-scroll">

                    <div className="fc-overview-cards">

                                >

                                        <button

                                            aria-label="Close"
                                        >

            );
        });

        // --- ZOOMABLE CHART WRAPPER ---
        // Supports: Mouse wheel zoom, pinch-to-zoom, drag to pan, double-click to reset
        const useChartZoom = (dataLength, zoomState) => {
            const [zoomDomain, setZoomDomain] = zoomState;
            const [isDragging, setIsDragging] = useState(false);
            const [dragStart, setDragStart] = useState(null);
            const containerRef = useRef(null);

            useEffect(() => {
                const el = containerRef.current;
                if (!el) return;

                const handleWheel = (e) => {
                    // Use the rendered plot bounds so legends, axes and margins
                    // keep normal scrolling, including after a resize or zoom.
                    const rect = el.querySelector('.recharts-cartesian-grid')?.getBoundingClientRect();
                    if (!rect || rect.width <= 0 || rect.height <= 0 ||
                        e.clientX < rect.left || e.clientX > rect.right ||
                        e.clientY < rect.top || e.clientY > rect.bottom) return;

                    // A native, non-passive listener can cancel scrolling. Keep
                    // consuming the wheel at the zoom limits so the panel stays put.
                    e.preventDefault();
                    e.stopPropagation();
                    const delta = e.deltaY || e.deltaX;
                    if (!delta) return;
                    const cursorRatio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
                    const wantZoomIn = delta < 0;

                    setZoomDomain((prev) => {
                        const last = Math.max(0, dataLength - 1);
                        const minRange = Math.min(last, Math.max(5, Math.floor(dataLength * 0.05)));
                        let start = Math.max(0, Math.min(prev.start, last));
                        let end = Math.max(start, Math.min(prev.end, last));
                        const range = end - start;
                        const zoomFactor = 0.1;

                        if (wantZoomIn && range > minRange) {
                            const reduction = Math.max(1, Math.floor(range * zoomFactor));
                            const leftReduction = Math.floor(reduction * cursorRatio);
                            const rightReduction = reduction - leftReduction;
                            start = Math.min(start + leftReduction, end - minRange);
                            end = Math.max(end - rightReduction, start + minRange);
                        } else if (!wantZoomIn && range < last) {
                            const expansion = Math.max(1, Math.floor(range * zoomFactor));
                            const leftExpansion = Math.floor(expansion * cursorRatio);
                            const rightExpansion = expansion - leftExpansion;
                            start = Math.max(0, start - leftExpansion);
                            end = Math.min(last, end + rightExpansion);
                        }
                        if (end < start) end = start;
                        return { start, end };
                    });
                };

                el.addEventListener('wheel', handleWheel, { passive: false });
                return () => el.removeEventListener('wheel', handleWheel);
            }, [dataLength]);

            const handleMouseDown = (e) => {
                if (e.button === 0) { // Left click only
                    setIsDragging(true);
                    setDragStart({ x: e.clientX, domain: { ...zoomDomain } });
                }
            };

            const handleMouseMove = (e) => {
                if (!isDragging || !dragStart) return;

                const rect = containerRef.current?.getBoundingClientRect();
                if (!rect) return;

                const deltaX = e.clientX - dragStart.x;
                const range = dragStart.domain.end - dragStart.domain.start;
                const pixelsPerPoint = rect.width / range;
                const pointsDelta = Math.round(-deltaX / pixelsPerPoint);

                const newStart = Math.max(0, Math.min(dataLength - 1 - range, dragStart.domain.start + pointsDelta));
                const newEnd = newStart + range;

                setZoomDomain({ start: newStart, end: Math.min(dataLength - 1, newEnd) });
            };

            const handleMouseUp = () => {
                setIsDragging(false);
                setDragStart(null);
            };

            const handleDoubleClick = () => {
                // Reset to full view
                setZoomDomain({ start: 0, end: dataLength - 1 });
            };

            // Explicit Zoom Helpers — functional updates so rapid +/- clicks never use stale domain
            const zoomIn = () => {
                setZoomDomain((prev) => {
                    const last = Math.max(0, dataLength - 1);
                    const minRange = Math.min(last, Math.max(5, Math.floor(dataLength * 0.05)));
                    let start = Math.max(0, Math.min(prev.start, last));
                    let end = Math.max(start, Math.min(prev.end, last));
                    const range = end - start;
                    if (range <= minRange) return { start, end };

                    const reduction = Math.max(1, Math.floor(range * 0.25));
                    const half = Math.floor(reduction / 2);
                    start = Math.min(start + half, end - minRange);
                    end = Math.max(end - (reduction - half), start + minRange);
                    if (end - start < minRange) end = Math.min(last, start + minRange);
                    start = Math.max(0, Math.min(start, end));
                    end = Math.min(last, Math.max(end, start));
                    return { start, end };
                });
            };

            const zoomOut = () => {
                setZoomDomain((prev) => {
                    const last = Math.max(0, dataLength - 1);
                    let start = Math.max(0, Math.min(prev.start, last));
                    let end = Math.max(start, Math.min(prev.end, last));
                    if (start <= 0 && end >= last) return { start: 0, end: last };

                    const range = Math.max(1, end - start);
                    const expansion = Math.max(1, Math.floor(range * 0.25));
                    const half = Math.floor(expansion / 2);
                    start = Math.max(0, start - half);
                    end = Math.min(last, end + (expansion - half));
                    return { start, end };
                });
            };

            // Touch: two-finger pan (horizontal) + pinch zoom. One-finger still scrolls the page.
            const lastTouchDistance = useRef(null);
            const lastTouchCenter = useRef(null);
            const panAccum = useRef(0);
            const zoomDomainRef = useRef(zoomDomain);
            const dragStartRef = useRef(dragStart);
            const isDraggingRef = useRef(isDragging);
            zoomDomainRef.current = zoomDomain;
            dragStartRef.current = dragStart;
            isDraggingRef.current = isDragging;

            useEffect(() => {
                const el = containerRef.current;
                if (!el) return;

                const plotRect = () => (
                    el.querySelector('.recharts-cartesian-grid')?.getBoundingClientRect()
                    || el.getBoundingClientRect()
                );

                const twoFingerMetrics = (touches) => {
                    const dx = touches[0].clientX - touches[1].clientX;
                    const dy = touches[0].clientY - touches[1].clientY;
                    return {
                        distance: Math.hypot(dx, dy),
                        centerX: (touches[0].clientX + touches[1].clientX) / 2,
                    };
                };

                const setTwoFingerCapture = (on) => {
                    const value = on ? 'none' : '';
                    el.style.touchAction = value;
                    el.querySelectorAll('.recharts-wrapper, .recharts-surface').forEach((node) => {
                        node.style.touchAction = value;
                    });
                };

                const onTouchStart = (e) => {
                    if (e.touches.length >= 2) {
                        e.preventDefault();
                        setTwoFingerCapture(true);
                        const { distance, centerX } = twoFingerMetrics(e.touches);
                        lastTouchDistance.current = distance;
                        lastTouchCenter.current = centerX;
                        panAccum.current = 0;
                        setIsDragging(false);
                        setDragStart(null);
                        return;
                    }
                    const rect = el.getBoundingClientRect();
                    const touchY = e.touches[0].clientY - rect.top;
                    const isBottomArea = touchY > rect.height * 0.85;
                    if (e.touches.length === 1 && isBottomArea) {
                        setIsDragging(true);
                        setDragStart({ x: e.touches[0].clientX, domain: { ...zoomDomainRef.current } });
                    }
                };

                const onTouchMove = (e) => {
                    if (e.touches.length >= 2) {
                        e.preventDefault();
                        const { distance, centerX } = twoFingerMetrics(e.touches);
                        const prevDist = lastTouchDistance.current;
                        const prevCenter = lastTouchCenter.current;
                        lastTouchDistance.current = distance;
                        lastTouchCenter.current = centerX;
                        if (!prevDist || prevCenter == null) return;

                        const scale = distance / prevDist;
                        const panPx = centerX - prevCenter;
                        const rect = plotRect();
                        const plotWidth = Math.max(1, rect.width);
                        const currentRange = Math.max(1, zoomDomainRef.current.end - zoomDomainRef.current.start);
                        panAccum.current += -panPx / (plotWidth / currentRange);
                        const panPoints = Math.round(panAccum.current);
                        if (panPoints !== 0) panAccum.current -= panPoints;

                        setZoomDomain((prev) => {
                            const last = Math.max(0, dataLength - 1);
                            const minRange = Math.min(last, Math.max(5, Math.floor(dataLength * 0.05)));
                            let start = prev.start;
                            let end = prev.end;
                            let range = Math.max(1, end - start);

                            if (panPoints !== 0) {
                                const newStart = Math.max(0, Math.min(last - range, start + panPoints));
                                start = newStart;
                                end = start + range;
                            }

                            const zoomed = scale > 1.008 || scale < 0.992;
                            if (zoomed) {
                                const cursorRatio = Math.min(1, Math.max(0, (centerX - rect.left) / plotWidth));
                                const nextRange = Math.max(minRange, Math.min(last, range / scale));
                                const focus = start + range * cursorRatio;
                                start = focus - nextRange * cursorRatio;
                                end = start + nextRange;
                            }

                            if (end - start > last) {
                                start = 0;
                                end = last;
                            } else if (start < 0) {
                                end -= start;
                                start = 0;
                                if (end > last) end = last;
                            } else if (end > last) {
                                start -= (end - last);
                                end = last;
                                if (start < 0) start = 0;
                            }

                            start = Math.round(Math.max(0, Math.min(start, last)));
                            end = Math.round(Math.max(start, Math.min(end, last)));
                            if (end - start < minRange && last >= minRange) {
                                end = Math.min(last, start + minRange);
                                start = Math.max(0, end - minRange);
                            }
                            return { start, end };
                        });
                        return;
                    }

                    const start = dragStartRef.current;
                    if (e.touches.length === 1 && isDraggingRef.current && start) {
                        e.preventDefault();
                        const rect = plotRect();
                        const deltaX = e.touches[0].clientX - start.x;
                        const range = start.domain.end - start.domain.start;
                        const pixelsPerPoint = rect.width / Math.max(1, range);
                        const pointsDelta = Math.round(-deltaX / pixelsPerPoint);
                        const newStart = Math.max(0, Math.min(dataLength - 1 - range, start.domain.start + pointsDelta));
                        setZoomDomain({ start: newStart, end: Math.min(dataLength - 1, newStart + range) });
                    }
                };

                const onTouchEnd = (e) => {
                    if (e.touches.length < 2) {
                        lastTouchDistance.current = null;
                        lastTouchCenter.current = null;
                        panAccum.current = 0;
                        setTwoFingerCapture(false);
                    }
                    if (e.touches.length === 0) {
                        setIsDragging(false);
                        setDragStart(null);
                    }
                };

                const preventGesture = (e) => { e.preventDefault(); };

                el.addEventListener('touchstart', onTouchStart, { passive: false });
                el.addEventListener('touchmove', onTouchMove, { passive: false });
                el.addEventListener('touchend', onTouchEnd);
                el.addEventListener('touchcancel', onTouchEnd);
                el.addEventListener('gesturestart', preventGesture, { passive: false });
                el.addEventListener('gesturechange', preventGesture, { passive: false });

                return () => {
                    setTwoFingerCapture(false);
                    el.removeEventListener('touchstart', onTouchStart);
                    el.removeEventListener('touchmove', onTouchMove);
                    el.removeEventListener('touchend', onTouchEnd);
                    el.removeEventListener('touchcancel', onTouchEnd);
                    el.removeEventListener('gesturestart', preventGesture);
                    el.removeEventListener('gesturechange', preventGesture);
                };
            }, [dataLength]);

            return {
                zoomDomain,
                containerRef,
                handlers: {
                    onMouseDown: handleMouseDown,
                    onMouseMove: handleMouseMove,
                    onMouseUp: handleMouseUp,
                    onMouseLeave: handleMouseUp,
                    onDoubleClick: handleDoubleClick
                    // Touch handlers removed from here, handled natively
                },
                isDragging,
                zoomIn,
                zoomOut
            };
        };

        const CHART_LEGEND_LINES = {
            actual_train: { line: 'is-train', text: 'text-slate-500 dark:text-slate-400' },
            actual_test: { line: 'is-test', text: 'text-emerald-600 dark:text-emerald-400' },
            fitted: { line: 'is-fitted', text: 'text-slate-400 dark:text-slate-500' },
            val_forecast: { line: 'is-forecast', text: 'text-amber-600 dark:text-amber-400' },
            actual_history: { line: 'is-train', text: 'text-slate-500 dark:text-slate-400' },
            final_fit: { line: 'is-fitted', text: 'text-slate-400 dark:text-slate-500' },
            future_forecast: { line: 'is-forecast', text: 'text-amber-600 dark:text-amber-400' },
        };

        const useCompactChartChrome = () => {
            const query = '(max-width: 768px), (orientation: landscape) and (max-height: 500px)';
            const [compact, setCompact] = useState(() => window.matchMedia(query).matches);
            useEffect(() => {
                const media = window.matchMedia(query);
                const update = () => setCompact(media.matches);
                update();
                media.addEventListener('change', update);
                return () => media.removeEventListener('change', update);
            }, []);
            return compact;
        };

        const chartTooltipLabel = (name, compact) => {
            if (!compact || !name) return name;
            const split = name.indexOf(' (');
            return split > 0 ? name.slice(0, split) : name;
        };

        const CompactChartTooltip = ({ active, payload, label, isDark, compact, locale }) => {
            if (!active || !payload?.length) return null;
            const items = payload.filter(entry => entry?.value != null && entry.value !== '' && !Number.isNaN(Number(entry.value)));
            if (!items.length) return null;
            return (
                <div className={`fc-chart-tooltip rounded-md border shadow-md ${isDark ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-white border-slate-200 text-slate-900'}`}>
                    {label != null && label !== '' && (
                        <div className={`fc-chart-tooltip-label font-semibold ${isDark ? 'border-slate-700/70' : 'border-slate-200/70'} border-b`}>{label}</div>
                    )}
                    <ul className="fc-chart-tooltip-items">
                        {items.map(entry => (

        const MappingModal = ({ headers, isOpen, onClose, onConfirm, t }) => {
            const [sku, setSku] = useState('');
            const [startCol, setStartCol] = useState('');
            const [endCol, setEndCol] = useState('');

            // Calculate number of months between start and end columns
            const monthCount = useMemo(() => {
                if (!startCol || !endCol || !headers.length) return 0;
                const startIdx = headers.indexOf(startCol);
                const endIdx = headers.indexOf(endCol);
                if (startIdx < 0 || endIdx < 0 || endIdx < startIdx) return 0;
                return endIdx - startIdx + 1;
            }, [startCol, endCol, headers]);

            useEffect(() => {
                if (isOpen && headers.length) {
                    console.log('MappingModal headers:', headers.slice(0, 5), '...');

                    // Auto-detect date/month columns FIRST
                    // Check for text month patterns OR datetime format patterns
                    const monthPatterns = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
                    const datePatterns = [/^\d{4}-\d{2}-\d{2}/, /^\d{4}\/\d{2}\/\d{2}/, /^\d{2}[-\/]\d{2}[-\/]\d{4}/];

                    const dateIndices = headers.map((h, i) => {
                        const headerStr = String(h);
                        const headerLower = headerStr.toLowerCase();
                        // Check text month patterns (case insensitive)
                        if (monthPatterns.some(p => headerLower.includes(p))) return i;
                        // Check datetime patterns (YYYY-MM-DD, etc.) on original string
                        if (datePatterns.some(p => p.test(headerStr))) return i;
                        // Check if it looks like a date string (contains year numbers)
                        if (/20\d{2}/.test(headerStr) || /19\d{2}/.test(headerStr)) return i;
                        return -1;
                    }).filter(i => i >= 0);

                    console.log('Detected date column indices:', dateIndices);

                    // Auto-detect SKU column (first non-date column that matches patterns)
                    const findSku = () => {
                        const patterns = ['sku', 'id', 'item', 'product', 'unique_id', 'item_id'];
                        for (let i = 0; i < headers.length; i++) {
                            // Skip if this is a detected date column
                            if (dateIndices.includes(i)) continue;
                            const headerLower = String(headers[i]).toLowerCase();
                            if (patterns.some(p => headerLower.includes(p))) {
                                return headers[i];
                            }
                        }
                        // Fallback: first non-date column
                        for (let i = 0; i < headers.length; i++) {
                            if (!dateIndices.includes(i)) return headers[i];
                        }
                        return headers[0];
                    };

                    // Always auto-suggest when modal opens (user can still change if needed)
                    setSku(findSku());
                    if (dateIndices.length > 0) {
                        setStartCol(headers[dateIndices[0]]);
                        setEndCol(headers[dateIndices[dateIndices.length - 1]]);
                    }
                }
            }, [isOpen, headers]);

            const handleConfirm = () => {
                onConfirm(sku, startCol, endCol);
            };

            if (!isOpen) return null;

            // Filter headers for month selection (exclude SKU column and other non-numeric columns)
            const potentialMonthCols = headers;

                                <select className="w-full text-xs p-2 border rounded bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:text-white outline-none focus:border-brand-gold transition-colors" value={sku} onChange={e => setSku(e.target.value)}>
                                    {headers.map(h => <option key={h} value={h}>{h}</option>)}
                                </select>
                            </div>

                            {/* Month Range Selection */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">{t('mapping.start_col')}</label>

        const SettingsModal = ({ isOpen, onClose, activeTab, setActiveTab, theme, setTheme, lang, setLang, t, visibleModels, onToggleVisibleModel, isModelAvailable, capabilitiesStatus, isRunning }) => {
            const dialogRef = useRef(null);
            useEffect(() => {
                if (!isOpen) return;
                const previousFocus = document.activeElement;
                const dialog = dialogRef.current;
                dialog.querySelector('[data-settings-tab][aria-pressed="true"]')?.focus();
                const handleKeyDown = (event) => {
                    if (event.key === 'Escape') {
                        event.preventDefault();
                        onClose();
