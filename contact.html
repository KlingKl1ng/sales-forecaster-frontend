        const Reveal = ({ children, className = '', delay = 0 }) => {
            const ref = useRef(null);
            const [visible, setVisible] = useState(false);
            useEffect(() => {
                const el = ref.current;
                if (!el) return undefined;
                const obs = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setVisible(true);
                        obs.disconnect();
                    }
                }, { threshold: 0.16, rootMargin: '0px 0px -32px 0px' });
                obs.observe(el);
                return () => obs.disconnect();
            }, []);
            return (
                <div
                    ref={ref}
                    className={`contact-reveal ${visible ? 'is-visible' : ''} ${className}`}
                    style={{ transitionDelay: `${delay}ms` }}
                >
                    {children}
                </div>
            );
        };

        /* Same network/grid language as landing LandingCanvasBackground */
        const ContactCanvas = ({ theme }) => {
            const canvasRef = useRef(null);
            const frameRef = useRef(null);
            const stateRef = useRef({ nodes: [], w: 0, h: 0, linkDist: 130 });

            const isDark = useMemo(() => (
                theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
            ), [theme]);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return undefined;

                const ctx = canvas.getContext('2d');
                const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                const GRID_STEP = 48;

                const getNetworkParams = (w, h) => {
                    if (w < 768) return { nodeCount: 42, linkDist: 130 };
                    if (w < 1024) return { nodeCount: 48, linkDist: 140 };
                    const area = w * h;
                    const nodeCount = Math.max(52, Math.min(72, Math.round(area / 32000)));
                    const spacing = Math.sqrt(area / nodeCount);
                    const linkDist = Math.max(145, Math.min(190, Math.round(spacing * 1.35)));
                    return { nodeCount, linkDist };
                };

                const palette = () => (isDark ? {
                    grid: 'rgba(148, 163, 184, 0.07)',
                    line: 'rgba(251, 191, 36, 0.42)',
                    node: 'rgba(245, 158, 11, 0.5)',
                    vignette: 'rgba(2, 6, 23, 0.4)',
                } : {
                    grid: 'rgba(148, 163, 184, 0.14)',
                    line: 'rgba(217, 119, 6, 0.32)',
                    node: 'rgba(217, 119, 6, 0.38)',
                    vignette: 'rgba(248, 250, 252, 0.55)',
                });

                const seedNodes = (w, h, count) => Array.from({ length: count }, (_, i) => {
                    const isHub = i % 16 === 0;
                    return {
                        x: Math.random() * w,
                        y: Math.random() * h,
                        vx: (Math.random() - 0.5) * (isHub ? 0.07 : 0.12),
                        vy: (Math.random() - 0.5) * (isHub ? 0.07 : 0.12),
                        r: isHub ? 1.8 + Math.random() * 0.8 : 1 + Math.random() * 1.4,
                        hub: isHub,
                    };
                });

                const resize = () => {
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    const w = window.innerWidth;
                    const h = window.innerHeight;
                    const { nodeCount, linkDist } = getNetworkParams(w, h);
                    canvas.width = Math.floor(w * dpr);
                    canvas.height = Math.floor(h * dpr);
                    canvas.style.width = `${w}px`;
                    canvas.style.height = `${h}px`;
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                    const prev = stateRef.current;
                    const sizeChanged = Math.abs(prev.w - w) > 64 || Math.abs(prev.h - h) > 64;
                    const countChanged = prev.nodes.length !== nodeCount;
                    if (!prev.nodes.length || sizeChanged || countChanged) {
                        stateRef.current.nodes = seedNodes(w, h, nodeCount);
                    } else {
                        for (const node of prev.nodes) {
                            node.x = Math.max(0, Math.min(w, node.x));
                            node.y = Math.max(0, Math.min(h, node.y));
                        }
                    }
                    stateRef.current.w = w;
                    stateRef.current.h = h;
                    stateRef.current.linkDist = linkDist;
                };

                const draw = () => {
                    const { w, h, nodes, linkDist } = stateRef.current;
                    if (!w || !h) return;

                    const colors = palette();
                    ctx.clearRect(0, 0, w, h);

                    ctx.strokeStyle = colors.grid;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    for (let x = 0; x <= w; x += GRID_STEP) {
                        ctx.moveTo(x + 0.5, 0);
                        ctx.lineTo(x + 0.5, h);
                    }
                    for (let y = 0; y <= h; y += GRID_STEP) {
                        ctx.moveTo(0, y + 0.5);
                        ctx.lineTo(w, y + 0.5);
                    }
                    ctx.stroke();

                    const cx = w / 2;
                    const cy = h / 2;
                    const radius = Math.max(w, h) * 0.72;
                    const vignette = ctx.createRadialGradient(cx, cy, radius * 0.15, cx, cy, radius);
                    vignette.addColorStop(0, 'rgba(0,0,0,0)');
                    vignette.addColorStop(1, colors.vignette);
                    ctx.fillStyle = vignette;
                    ctx.fillRect(0, 0, w, h);

                    if (!prefersReducedMotion) {
                        for (const node of nodes) {
                            node.x += node.vx;
                            node.y += node.vy;
                            if (node.x <= 0 || node.x >= w) node.vx *= -1;
                            if (node.y <= 0 || node.y >= h) node.vy *= -1;
                            node.x = Math.max(0, Math.min(w, node.x));
                            node.y = Math.max(0, Math.min(h, node.y));
                        }
                    }

                    const maxLink = linkDist || 130;
                    const hubBonus = w >= 1024 ? maxLink * 0.12 : 0;
                    for (let i = 0; i < nodes.length; i++) {
                        for (let j = i + 1; j < nodes.length; j++) {
                            const dx = nodes[i].x - nodes[j].x;
                            const dy = nodes[i].y - nodes[j].y;
                            const dist = Math.hypot(dx, dy);
                            const reach = maxLink + ((nodes[i].hub || nodes[j].hub) ? hubBonus : 0);
                            if (dist < reach) {
                                const fade = 1 - dist / reach;
                                ctx.globalAlpha = 0.18 + fade * (isDark ? 0.38 : 0.32);
                                ctx.strokeStyle = colors.line;
                                ctx.lineWidth = 1;
                                ctx.beginPath();
                                ctx.moveTo(nodes[i].x, nodes[i].y);
                                ctx.lineTo(nodes[j].x, nodes[j].y);
                                ctx.stroke();
                            }
                        }
                    }
                    ctx.globalAlpha = 1;

                    for (const node of nodes) {
                        ctx.beginPath();
                        ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
                        ctx.fillStyle = colors.node;
                        ctx.fill();
                    }
                };

                const tick = () => {
                    draw();
                    frameRef.current = requestAnimationFrame(tick);
                };

                resize();
                draw();
                window.addEventListener('resize', resize);
                frameRef.current = requestAnimationFrame(tick);
                return () => {
                    window.removeEventListener('resize', resize);
                    if (frameRef.current) cancelAnimationFrame(frameRef.current);
                };
            }, [isDark]);

            return <canvas ref={canvasRef} className="contact-canvas-bg" aria-hidden="true" />;
        };

        const HeaderNav = ({ items, activeId, onNav, navRef, onCollapseChange }) => {
            const slotRef = useRef(null);
            const rulerRef = useRef(null);
            const scrollRef = useRef(null);
            const trackRef = useRef(null);
            const tabRefs = useRef({});
            const triggerRefs = useRef({});
            const [navFits, setNavFits] = useState(true);
            const handoffRef = useRef(undefined);
            if (handoffRef.current === undefined) {
                handoffRef.current = typeof window.OperartisNavIndicator?.consume === 'function'
                    ? window.OperartisNavIndicator.consume()
                    : null;
            }
            const handoffPendingRef = useRef(!!handoffRef.current);
            const [indicator, setIndicator] = useState(() => {
                const handoff = handoffRef.current;
                if (handoff) {
                    return {
                        left: handoff.left,
                        top: handoff.top,
                        width: handoff.width,
                        height: handoff.height,
                        ready: true,
                    };
                }
                return { left: 0, top: 0, width: 0, height: 0, ready: false };
            });
            const [indicatorAnimated, setIndicatorAnimated] = useState(false);
            const [openMenuId, setOpenMenuId] = useState(null);
            const [openNestedId, setOpenNestedId] = useState(null);
            const [nestedPlacement, setNestedPlacement] = useState('right');
            const [menuRect, setMenuRect] = useState(null);
            const menuCloseTimerRef = useRef(null);
            const nestedTriggerRefs = useRef({});

            const clearMenuCloseTimer = useCallback(() => {
                if (menuCloseTimerRef.current) {
                    clearTimeout(menuCloseTimerRef.current);
                    menuCloseTimerRef.current = null;
                }
            }, []);

            const prefersHoverMenus = useCallback(() => {
                try {
                    return window.matchMedia('(hover: hover) and (pointer: fine)').matches;
                } catch (e) {
                    return true;
                }
            }, []);

            const openMenu = useCallback((id) => {
                clearMenuCloseTimer();
                setOpenNestedId(null);
                setOpenMenuId(id);
            }, [clearMenuCloseTimer]);

            const closeMenu = useCallback(() => {
                clearMenuCloseTimer();
                setOpenNestedId(null);
                setOpenMenuId(null);
            }, [clearMenuCloseTimer]);

            const scheduleCloseMenu = useCallback(() => {
                clearMenuCloseTimer();
                menuCloseTimerRef.current = setTimeout(() => {
                    menuCloseTimerRef.current = null;
                    setOpenNestedId(null);
                    setOpenMenuId(null);
                }, 160);
            }, [clearMenuCloseTimer]);

            useEffect(() => () => clearMenuCloseTimer(), [clearMenuCloseTimer]);

            const openMenuItem = useMemo(
                () => items.find(item => item.id === openMenuId) || null,
                [items, openMenuId]
            );

            const indicatorTargetId = useMemo(() => {
                const match = items.find(item => navItemContainsId(item, activeId));
                return match ? match.id : null;
            }, [activeId, items]);

            const isTabActive = useCallback((item) => {
                if (item.children?.length) {
                    return navItemContainsId(item, activeId);
                }
                return activeId === item.id;
            }, [activeId]);

            const updateIndicator = useCallback(() => {
                if (handoffPendingRef.current) return;
                const track = trackRef.current;
                const target = tabRefs.current[indicatorTargetId];
                if (!track || !target) {
                    setIndicator(prev => (prev.ready ? { ...prev, ready: false } : prev));
                    return;
                }
                const trackRect = track.getBoundingClientRect();
                const targetRect = target.getBoundingClientRect();
                setIndicator({
                    left: targetRect.left - trackRect.left,
                    top: targetRect.top - trackRect.top,
                    width: targetRect.width,
                    height: targetRect.height,
                    ready: true,
                });
                if (!indicatorAnimated) {
                    requestAnimationFrame(() => setIndicatorAnimated(true));
                }
            }, [indicatorTargetId, indicatorAnimated]);

            useLayoutEffect(() => {
                if (!navFits) return undefined;

                let cancelled = false;
                let outerRaf = 0;
                let innerRaf = 0;

                if (handoffPendingRef.current) {
                    outerRaf = requestAnimationFrame(() => {
                        if (cancelled) return;
                        setIndicatorAnimated(true);
                        innerRaf = requestAnimationFrame(() => {
                            if (cancelled) return;
                            handoffPendingRef.current = false;
                            updateIndicator();
                        });
                    });
                } else {
                    updateIndicator();
                }

                const ro = new ResizeObserver(() => {
                    if (handoffPendingRef.current) return;
                    updateIndicator();
                });
                if (trackRef.current) ro.observe(trackRef.current);
                Object.values(tabRefs.current).forEach(el => {
                    if (el) ro.observe(el);
                });
                window.addEventListener('resize', updateIndicator);
                return () => {
                    cancelled = true;
                    cancelAnimationFrame(outerRaf);
                    cancelAnimationFrame(innerRaf);
                    ro.disconnect();
                    window.removeEventListener('resize', updateIndicator);
                };
            }, [indicatorTargetId, items, navFits, updateIndicator]);

            const setTabRef = useCallback((id, el) => {
                if (el) tabRefs.current[id] = el;
                else delete tabRefs.current[id];
            }, []);

            useEffect(() => {
                if (navRef) navRef.current = slotRef.current;
            }, [navRef]);

            useEffect(() => {
                const measure = () => {
                    const slot = slotRef.current;
                    const ruler = rulerRef.current;
                    if (!slot || !ruler) return;
                    const fits = ruler.scrollWidth <= slot.clientWidth + 2;
                    setNavFits(prev => {
                        if (prev !== fits) onCollapseChange?.(!fits);
                        return fits;
                    });
                };
                measure();
                const ro = new ResizeObserver(measure);
                if (slotRef.current) ro.observe(slotRef.current);
                if (rulerRef.current) ro.observe(rulerRef.current);
                window.addEventListener('resize', measure);
                return () => {
                    ro.disconnect();
                    window.removeEventListener('resize', measure);
                };
            }, [items, onCollapseChange]);

            useEffect(() => {
                if (!navFits) setOpenMenuId(null);
            }, [navFits]);

            const updateMenuRect = useCallback(() => {
                if (!openMenuId) return;
                const el = triggerRefs.current[openMenuId];
                if (!el) return;
                const r = el.getBoundingClientRect();
                setMenuRect({
                    top: r.bottom + 8,
                    left: r.left,
                    minWidth: Math.max(r.width, 192),
                });
            }, [openMenuId]);

            useEffect(() => {
                if (!openMenuId) {
                    setMenuRect(null);
                    return undefined;
                }
                updateMenuRect();
                const onLayout = () => updateMenuRect();
                window.addEventListener('resize', onLayout);
                window.addEventListener('scroll', onLayout, true);
                return () => {
                    window.removeEventListener('resize', onLayout);
                    window.removeEventListener('scroll', onLayout, true);
                };
            }, [openMenuId, updateMenuRect]);

            useEffect(() => {
                if (!openMenuId) {
                    setOpenNestedId(null);
                    return undefined;
                }
                const onKeyDown = (e) => {
                    if (e.key !== 'Escape') return;
                    if (openNestedId) {
                        setOpenNestedId(null);
                        return;
                    }
                    closeMenu();
                };
                window.addEventListener('keydown', onKeyDown);
                return () => window.removeEventListener('keydown', onKeyDown);
            }, [openMenuId, openNestedId, closeMenu]);

            useLayoutEffect(() => {
                if (!openNestedId) {
                    setNestedPlacement('right');
                    return undefined;
                }
                const el = nestedTriggerRefs.current[openNestedId];
                if (!el) return undefined;
                const updatePlacement = () => {
                    const r = el.getBoundingClientRect();
                    const spaceRight = window.innerWidth - r.right;
                    setNestedPlacement(spaceRight < 200 ? 'left' : 'right');
                };
                updatePlacement();
                window.addEventListener('resize', updatePlacement);
                return () => window.removeEventListener('resize', updatePlacement);
            }, [openNestedId, menuRect]);

            useEffect(() => {
                if (!navFits) return undefined;
                const el = scrollRef.current;
                if (!el) return;
                const onWheel = (e) => {
                    if (el.scrollWidth <= el.clientWidth) return;
                    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
                    if (e.deltaY === 0) return;
                    e.preventDefault();
                    el.scrollLeft += e.deltaY;
                };
                el.addEventListener('wheel', onWheel, { passive: false });
                return () => el.removeEventListener('wheel', onWheel);
            }, [items, navFits]);

            const tabClass = (isActive) => `header-nav-tab ${isActive ? 'header-nav-tab-active' : ''}`;

            const toggleMenu = useCallback((id) => {
                setOpenNestedId(null);
                setOpenMenuId(prev => (prev === id ? null : id));
            }, []);

            const closeMenuAndNav = useCallback((id) => {
                onNav(id);
                closeMenu();
            }, [onNav, closeMenu]);

            const toggleNestedMenu = useCallback((id) => {
                setOpenNestedId(prev => (prev === id ? null : id));
            }, []);

            const onDropdownTriggerEnter = useCallback((id) => {
                if (!prefersHoverMenus()) return;
                openMenu(id);
            }, [openMenu, prefersHoverMenus]);

            const onDropdownTriggerLeave = useCallback(() => {
                if (!prefersHoverMenus()) return;
                scheduleCloseMenu();
            }, [prefersHoverMenus, scheduleCloseMenu]);

            const onDropdownMenuEnter = useCallback(() => {
                if (!prefersHoverMenus()) return;
                clearMenuCloseTimer();
            }, [clearMenuCloseTimer, prefersHoverMenus]);

            const onDropdownMenuLeave = useCallback(() => {
                if (!prefersHoverMenus()) return;
                scheduleCloseMenu();
            }, [prefersHoverMenus, scheduleCloseMenu]);

            const onPlainTabEnter = useCallback(() => {
                if (!prefersHoverMenus()) return;
                if (openMenuId) scheduleCloseMenu();
            }, [openMenuId, prefersHoverMenus, scheduleCloseMenu]);

            const renderMenuEntries = (entries) => {
                const nodes = [];
                entries.forEach((entry) => {
                    if (entry.children?.length) {
                        const isNestedOpen = openNestedId === entry.id;
                        const nestedActive = navItemContainsId(entry, activeId);
                        nodes.push(
                            <div
                                key={entry.id}
                                className="header-nav-aps-nested-wrap"
                                onMouseEnter={() => {
                                    if (prefersHoverMenus()) setOpenNestedId(entry.id);
                                }}
                            >
                                <button
                                    ref={(el) => {
                                        if (el) nestedTriggerRefs.current[entry.id] = el;
                                        else delete nestedTriggerRefs.current[entry.id];
                                    }}
                                    type="button"
                                    role="menuitem"
                                    aria-expanded={isNestedOpen}
                                    aria-haspopup="menu"
                                    onClick={() => toggleNestedMenu(entry.id)}
                                    className={`${tabClass(nestedActive)} header-nav-child header-nav-aps-nested-trigger`}

        const ContactForm = ({ copy }) => {
            const [name, setName] = useState('');
            const [email, setEmail] = useState('');
            const [company, setCompany] = useState('');
            const [message, setMessage] = useState('');
            const [status, setStatus] = useState('');
            const [statusTone, setStatusTone] = useState('info');
            const [sending, setSending] = useState(false);

            const onSubmit = async (event) => {
                event.preventDefault();
                if (sending) return;

                const trimmedName = name.trim();
                const trimmedEmail = email.trim();
                const trimmedCompany = company.trim();
                const trimmedMessage = message.trim();
                if (!trimmedName || !trimmedEmail || !trimmedMessage) {
                    setStatusTone('error');
                    setStatus(copy.form_required);
                    return;
                }

                setSending(true);
                setStatusTone('info');
                setStatus(copy.form_sending);

                const payload = {
                    name: trimmedName,
                    email: trimmedEmail,
                    company: trimmedCompany,
                    message: trimmedMessage,
                };

                try {
                    if (window.OperartisApi && typeof window.OperartisApi.submitContact === 'function') {
                        await window.OperartisApi.submitContact(payload);
                    } else {
                        const base = window.OperartisApi?.getDefaultApiBase?.() || 'http://127.0.0.1:8000';
                        const response = await fetch(`${base}/contact`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify(payload),
                        });
                        const data = await response.json().catch(() => ({}));
                        if (!response.ok) {
                            throw new Error(
                                (typeof data.detail === 'string' && data.detail) || copy.form_error
                            );
                        }
                    }
                    setStatusTone('success');
                    setStatus(copy.form_sent);
                    setName('');
                    setEmail('');
                    setCompany('');
                    setMessage('');
                } catch (error) {
                    setStatusTone('error');
                    setStatus((error && error.message) || copy.form_error);
                } finally {
                    setSending(false);
                }
            };

                        />

                        <label htmlFor="contact-message">{copy.form_message}</label>

                            required
                            disabled={sending}
                            value={message}
                            onChange={(e) => setMessage(e.target.value)}
                        />

                        type="submit"
                        disabled={sending}
                        className="w-full inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-brand-gold text-white text-sm font-bold shadow-lg shadow-brand-gold/20 hover:bg-amber-600 hover:shadow-brand-gold/40 hover:scale-[1.01] active:scale-95 transition-all disabled:opacity-60 disabled:pointer-events-none"
                    >
                        {sending ? copy.form_sending : copy.form_submit}

                const onTheme = (event) => setThemeState((event.detail && event.detail.theme) || window.getOperartisTheme());
                window.addEventListener('operartis:lang-change', onLang);
                window.addEventListener('operartis:theme-change', onTheme);
                return () => {
                    window.removeEventListener('operartis:lang-change', onLang);
                    window.removeEventListener('operartis:theme-change', onTheme);
                };
            }, []);

            useEffect(() => {
                document.title = `Operartis | ${copy.page_title}`;
                document.documentElement.lang = lang;
            }, [copy.page_title, lang]);

            useEffect(() => {
                if (!navCollapsed) setMobileNavOpen(false);
            }, [navCollapsed]);

            useEffect(() => {
                const handleAuthState = (event) => {
                    const user = event.detail?.user || window.OperartisAuth?.getUser?.() || null;
                    setAuthUser(user);
                    if (user) setAccountMenuOpen(false);
                };
                const handleLoggedOut = () => {
                    setAuthUser(null);
                    setAccountMenuOpen(false);
                };
                window.addEventListener('operartis:authenticated', handleAuthState);
                window.addEventListener('operartis:auth-state', handleAuthState);
                window.addEventListener('operartis:logged-out', handleLoggedOut);
                window.OperartisAuth?.refresh?.().catch(() => setAuthUser(null));
                return () => {
                    window.removeEventListener('operartis:authenticated', handleAuthState);
                    window.removeEventListener('operartis:auth-state', handleAuthState);
                    window.removeEventListener('operartis:logged-out', handleLoggedOut);
                };
            }, []);

            useEffect(() => {
                if (!accountMenuOpen) return undefined;
                const handleOutsideClick = (event) => {
                    if (!accountMenuRef.current || accountMenuRef.current.contains(event.target)) return;
                    setAccountMenuOpen(false);
                };
                const handleEscape = (event) => {
                    if (event.key === 'Escape') setAccountMenuOpen(false);
                };
                document.addEventListener('mousedown', handleOutsideClick);
                document.addEventListener('touchstart', handleOutsideClick, { passive: true });
                document.addEventListener('keydown', handleEscape);
                return () => {
                    document.removeEventListener('mousedown', handleOutsideClick);
                    document.removeEventListener('touchstart', handleOutsideClick);
                    document.removeEventListener('keydown', handleEscape);
                };
            }, [accountMenuOpen]);

            const cycleTheme = () => {
                const next = theme === 'system' ? 'light' : theme === 'light' ? 'dark' : 'system';
                window.setOperartisTheme(next);
                setThemeState(next);
            };

            const cycleLang = () => {
                // German kept in CONTACT_COPY; UI toggle is EN ↔ VI only.
                const order = ['en', 'vi'];
                const idx = order.indexOf(lang);
                const next = order[idx === -1 ? 0 : (idx + 1) % order.length];
                window.setOperartisLang(next);
                setLang(next);
            };

            const handleNavCollapse = useCallback((collapsed) => {
                setNavCollapsed(collapsed);
            }, []);

            const onNav = useCallback((id) => {
                navigateToNavId(id);
            }, []);

            const closeMobileNav = useCallback(() => setMobileNavOpen(false), []);

            const handleAuthButtonClick = useCallback(() => {
                setAccountMenuOpen((prev) => !prev);
            }, []);

            const handleDashboardOpen = useCallback(() => {
                setAccountMenuOpen(false);
                const canUseAdminDashboard = authUser?.role === 'owner' || authUser?.role === 'admin';
                window.location.href = canUseAdminDashboard ? './dashboard.html#admin-overview' : './dashboard.html';
            }, [authUser]);

            const handleLoginOpen = useCallback(() => {
                setAccountMenuOpen(false);
                window.OperartisAuth?.showLogin?.();
            }, []);

            const handleLogout = useCallback(async () => {
                setAccountMenuOpen(false);
                await window.OperartisAuth?.logout?.();
                setAuthUser(null);
            }, []);

            const trustItems = [copy.trust_4, copy.trust_5, copy.trust_6, copy.trust_3];
            const assuranceItems = [copy.assurance_1, copy.assurance_2, copy.assurance_3];

            return (
                <div className="contact-shell h-full bg-slate-50 dark:bg-[#020617] transition-colors duration-500">
                    <ContactCanvas theme={theme} />

                    <nav className="header-bar relative z-30 shrink-0 overflow-visible border-b border-slate-200/50 dark:border-slate-800/50">
                        <div className="max-w-7xl mx-auto w-full h-16 px-3 sm:px-6 md:px-10 flex items-center gap-2 md:gap-4 overflow-visible">
                            <div className="flex items-center gap-2 sm:gap-3 shrink-0 p-1.5 pr-3 sm:pr-4 md:pr-5 rounded-full border border-white/40 dark:border-white/10 bg-gradient-to-br from-white/20 to-white/5 dark:from-slate-800/30 dark:to-slate-900/10 shadow-[0_4px_16px_rgba(0,0,0,0.1),inset_0_1px_0_0_rgba(255,255,255,0.2)] backdrop-blur-md">
                                <a href="./">
                                    <img src="./icononly_transparent_nobuffer.png" alt="" className="h-8 w-8 md:h-10 md:w-10 object-contain cursor-pointer transition-transform hover:scale-110" onError={(e) => { e.target.style.display = 'none'; }} />
                                </a>
                                <span className="font-bold text-sm sm:text-base md:text-lg tracking-tight text-slate-900 dark:text-white leading-none">OPERARTIS</span>
                            </div>

                            <HeaderNav
                                navRef={headerNavRef}
                                items={pageNavItems}
                                activeId={activeNavId}
                                onNav={onNav}
                                onCollapseChange={handleNavCollapse}
                            />

                            {navCollapsed && (
                                <div className="ml-auto shrink-0 header-glass-pill">
                                    <button
                                        type="button"
                                        onClick={() => setMobileNavOpen(true)}
                                        aria-expanded={mobileNavOpen}
                                        aria-label="Open navigation"
                                        className="header-util-btn h-8 w-8 p-0"
                                    >
                                        <span className="header-util-icon" aria-hidden="true"><MenuIcon /></span>
                                    </button>
                                </div>
                            )}

                            <div className="flex items-center gap-1.5 md:gap-6 shrink-0">
                                <div className="hidden md:flex header-glass-pill header-glass-pill--wide items-center">
                                    <button
                                        type="button"
                                        onClick={cycleTheme}
                                        className="header-util-btn"
                                        title={theme === 'light' ? 'Light mode — click for dark' : theme === 'dark' ? 'Dark mode — click for system' : 'System theme — follows OS — click for light'}
                                    >
                                        <span className="header-util-icon" aria-hidden="true">
                                            {theme === 'light' ? <SunIcon /> : theme === 'dark' ? <MoonIcon /> : <SystemIcon />}
                                        </span>
                                    </button>
                                    <span className="w-px h-4 shrink-0 self-center bg-slate-200 dark:bg-slate-700/50" aria-hidden="true" />
                                    <button type="button" onClick={cycleLang} className="header-util-btn gap-1 font-mono text-xs font-bold px-2">
                                        <span className="header-util-icon" aria-hidden="true"><GlobeIcon /></span>
                                        <span>{lang.toUpperCase()}</span>
                                    </button>
                                </div>

                                <div className="flex md:hidden items-center gap-1.5">
                                    <div className="header-glass-pill">
                                        <button
                                            type="button"
                                            onClick={cycleTheme}
                                            className="header-util-btn h-8 w-8 p-0"
                                            title={theme === 'light' ? 'Light mode — click for dark' : theme === 'dark' ? 'Dark mode — click for system' : 'System theme — follows OS — click for light'}
                                        >
                                            <span className="header-util-icon" aria-hidden="true">
                                                {theme === 'light' ? <SunIcon /> : theme === 'dark' ? <MoonIcon /> : <SystemIcon />}
                                            </span>
                                        </button>
                                    </div>
                                    <div className="header-glass-pill">
                                        <button type="button" onClick={cycleLang} className="header-util-btn h-8 w-8 p-0" aria-label={`Language: ${lang.toUpperCase()}`}>
                                            <span className="header-util-icon" aria-hidden="true"><GlobeIcon /></span>
                                        </button>
                                    </div>
                                </div>

                                <div ref={accountMenuRef} className="relative shrink-0">
                                    <button
                                        type="button"
                                        onClick={handleAuthButtonClick}
                                        aria-expanded={accountMenuOpen}
                                        aria-haspopup="menu"
                                        aria-label={authUser ? `Account: ${accountDisplayName(authUser)}` : copy.nav_login}
                                        title={authUser ? accountDisplayName(authUser) : copy.nav_login}
                                        className="relative header-auth-btn header-auth-btn--gold h-9 w-9 rounded-full bg-gradient-to-tr from-brand-gold to-brand-dark flex items-center justify-center text-white shrink-0"
                                    >
                                        <AccountAvatar user={authUser} />
                                        <span className={`absolute -right-0.5 -top-0.5 h-3 w-3 rounded-full border-2 border-[#020617] ${authUser ? 'bg-emerald-400 shadow-[0_0_0_2px_rgba(52,211,153,0.28),0_0_12px_rgba(52,211,153,0.9)]' : 'bg-white shadow-[0_0_0_1px_rgba(255,255,255,0.45)]'}`} aria-hidden="true" />
                                    </button>

                                    {accountMenuOpen && (
                                        <div role="menu" aria-label="Account menu" className="index-account-menu">
                                            {authUser && (
                                                <div className="index-account-menu-head">
                                                    <p className="index-account-menu-email">{accountDisplayName(authUser)}</p>
                                                    <p className="index-account-menu-role">{authUser.role}</p>
                                                </div>
                                            )}
                                            <div className="index-account-menu-body">
                                                <button type="button" role="menuitem" onClick={handleDashboardOpen} className="index-account-menu-item">
                                                    <span className="index-account-menu-item-icon" aria-hidden="true"><AccountDashboardIcon /></span>
                                                    <span>{copy.nav_dashboard}</span>
                                                </button>
                                                <div className="index-account-menu-divider" role="separator" aria-hidden="true" />
                                                {authUser ? (
                                                    <button type="button" role="menuitem" onClick={handleLogout} className="index-account-menu-item index-account-menu-item--danger">
                                                        <span className="index-account-menu-item-icon" aria-hidden="true"><AccountLogoutIcon /></span>
                                                        <span>{copy.nav_logout}</span>
                                                    </button>
                                                ) : (
                                                    <button type="button" role="menuitem" onClick={handleLoginOpen} className="index-account-menu-item">
                                                        <span className="index-account-menu-item-icon" aria-hidden="true"><AccountLoginIcon /></span>
                                                        <span>{copy.nav_login}</span>
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </nav>

                    <MobileNavDrawer
                        items={pageNavItems}
                        activeId={activeNavId}
                        onNav={onNav}
                        open={mobileNavOpen}
                        onClose={closeMobileNav}
                    />

                    <main className="relative z-10 flex-1 overflow-y-auto min-h-0">
                        <div className="max-w-6xl mx-auto px-4 sm:px-6 md:px-8 py-8 md:py-12 pb-16">
                            <section className="contact-hero rounded-3xl border border-amber-700/40 dark:border-white/[0.06] ring-0 dark:ring-1 dark:ring-white/[0.04] px-6 py-10 md:px-12 md:py-14 mb-10 md:mb-12">
                                <div className="relative z-10 max-w-3xl">
                                    <p className="text-[10px] font-bold uppercase contact-eyebrow text-brand-gold mb-3">{copy.eyebrow}</p>
                                    <h1 className="text-3xl sm:text-4xl md:text-5xl font-black tracking-tight text-slate-900 dark:text-white leading-[1.08] mb-4">
                                        {copy.headline}
                                    </h1>
                                </div>
                            </section>

                            <div className="grid lg:grid-cols-12 gap-6 md:gap-8 items-stretch">
                                <Reveal className="lg:col-span-4 h-full flex flex-col" delay={40}>
                                    <aside className="contact-panel border dark:border-white/[0.06] ring-0 dark:ring-1 dark:ring-white/[0.04] p-6 md:p-8 space-y-6 h-full flex-1">
                                        <div>
                                            <h2 className="text-xs font-bold uppercase contact-eyebrow text-brand-gold mb-3">{copy.email_label}</h2>
                                            <a
                                                href="mailto:info@operartis.io"
                                                className="inline-flex items-center gap-2.5 text-xl md:text-2xl font-bold text-slate-900 dark:text-white hover:text-brand-gold transition-colors break-all"
                                            >
                                                <span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-brand-gold/10 text-brand-gold">
                                                    <MailIcon />
                                                </span>
                                                info@operartis.io
                                            </a>
                                            <p className="mt-3 text-base text-slate-500 dark:text-slate-400 leading-relaxed">{copy.email_hint}</p>
                                        </div>

                                        <ul className="space-y-3 pt-2 border-t border-slate-300 dark:border-white/15">
                                            {trustItems.map((item) => (
                                                <li key={item} className="flex items-start gap-2.5 text-base text-slate-600 dark:text-slate-300">
                                                    <span className="mt-1 flex h-4 w-4 shrink-0 items-center justify-center" aria-hidden="true">
                                                        <span className="h-1.5 w-1.5 rounded-full bg-brand-gold" />
                                                    </span>
                                                    <span>{item}</span>
                                                </li>
                                            ))}
                                        </ul>

                                        <ul className="space-y-3 pt-4 border-t border-slate-300 dark:border-white/15">
                                            {assuranceItems.map((item) => (
                                                <li key={item} className="flex items-start gap-2.5 text-base text-slate-600 dark:text-slate-300">
                                                    <span className="mt-1 flex h-4 w-4 shrink-0 items-center justify-center text-brand-gold" aria-hidden="true">
                                                        <CheckIcon />
                                                    </span>
                                                    <span>{item}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </aside>
                                </Reveal>

                                <Reveal className="lg:col-span-8 h-full flex flex-col" delay={90}>
                                    <section className="contact-panel border dark:border-white/[0.06] ring-0 dark:ring-1 dark:ring-white/[0.04] p-6 md:p-8 h-full flex-1">
                                        <ContactForm copy={copy} />
                                    </section>
                                </Reveal>
                            </div>
                        </div>

                        <SiteFooter ui={copy} />
                    </main>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>

</html>
